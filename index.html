}
function loanForm(id) {
  return () => {
    const loan = id ? find("loans", id) : { name: "", startBalance: "", startDate: Core.today(), rate: "", monthly: "", payDay: "", note: "" };
    if (!loan) return null;
    return { title: id ? "Изменить кредит" : "Новый кредит", key: "loanform" + (id || ""), html: `<form id="f-loan"><section class="block">
      ${fld("Кредитор *", "name", loan.name, "text", 'placeholder="Банк или человек"')}
      ${fld("Долг на начало учёта, ₽ *", "startBalance", loan.startBalance, "number")}
      ${fld("На дату", "startDate", loan.startDate, "date")}
      <div class="grid2">${fld("Ставка, % годовых", "rate", loan.rate, "number")}${fld("Платёж в месяц, ₽", "monthly", loan.monthly, "number")}</div>
      ${fld("День платежа (1–31)", "payDay", loan.payDay, "number", 'min="1" max="31" step="1" inputmode="numeric"')}
      ${fld("Заметка", "note", loan.note)}
      ${id ? "" : `<label class="check"><input type="checkbox" name="received" value="1"> Деньги по кредиту поступили на счёт сейчас</label>
        <div id="recv" hidden>${accountSelect("accountId", "На счёт")}</div>
        <p class="hint">Для кредита, взятого до начала учёта, галку не ставьте — укажите текущий остаток долга.</p>`}
      </section><div id="f-err" class="err"></div>${formBtns()}</form>`,
      after: l => {
        const form = $("#f-loan", l);
        const cb = form.querySelector("input[name=received]");
        if (cb) cb.onchange = () => { $("#recv", l).hidden = !cb.checked; };
        form.onsubmit = e => {
          e.preventDefault(); const v = formData(form);
          const bal = Core.round2(Core.num(v.startBalance));
          if (!v.name) { $("#f-err", l).textContent = "Укажите кредитора."; return; }
          if (bal <= 0) { $("#f-err", l).textContent = "Укажите сумму долга."; return; }
          const day = Math.round(Core.num(v.payDay));
          if (v.payDay && (day < 1 || day > 31)) { $("#f-err", l).textContent = "День платежа — от 1 до 31."; return; }
          const rec = id ? loan : { id: Core.uid(), closed: false };
          Object.assign(rec, { name: v.name, startBalance: bal, startDate: v.startDate, rate: Core.num(v.rate), monthly: Core.round2(Core.num(v.monthly)), payDay: v.payDay ? day : "", note: v.note });
          touch(rec); if (!id) S.loans.push(rec);
          log("Кредит", rec.id, `${id ? "Изменён" : "Добавлен"} кредит «${rec.name}», долг ${rub(bal)}`);
          if (!id && (v.received || []).length) {
            const op = touch({ id: Core.uid(), kind: "Кредит получен", date: v.startDate || Core.today(), amount: bal, accountId: v.accountId, loanId: rec.id, note: "" });
            S.ops.push(op); log("Кредит", rec.id, `Кредит «${rec.name}»: ${rub(bal)} поступили на счёт «${accName(v.accountId)}»`);
          }
          sheets.pop(); if (!id) sheets.push(loanSheet(rec.id)); commit();
        };
      } };
  };
}
function loanPayForm(loanId, opId) {
  return () => {
    const loan = find("loans", loanId); if (!loan) return null;
    const op = opId ? find("ops", opId) : null;
    const B = Core.budget(S, D, view.ym);
    const x = B.L.get(loanId);
    const est = Core.round2((x.balance + (op ? Core.num(op.principal) : 0)) * Core.num(loan.rate) / 100 / 12);
    const amount = op ? op.amount : loan.monthly;
    const interest = op ? op.interest : "";
    return { title: `${op ? "Изменить платёж" : "Платёж"}: ${loan.name}`, key: "lpay" + loanId + (opId || ""), html: `<form id="f-lpay"><section class="block">
      ${fld("Сумма платежа, ₽ *", "amount", amount, "number")}
      ${fld("Дата", "date", op ? op.date : Core.today(), "date")}
      <div class="grid2">${fld("Из них проценты, ₽", "interest", interest, "number")}<label class="f">Основной долг, ₽<input id="lp-principal" value="" disabled></label></div>
      <p class="hint">Проценты возьмите из графика или выписки банка.${Core.num(loan.rate) ? ` Грубая оценка по остатку и ставке: ${rub(est)} — это не расчёт банка.` : ""}</p>
      ${accountSelect("accountId", "Со счёта", op ? op.accountId : "")}
      ${fld("Заметка", "note", op ? op.note : "")}
      </section><div id="f-err" class="err"></div>
      ${op ? `<div class="btns"><button type="button" class="btn danger" id="lp-del">${ic("trash")}Удалить платёж</button></div>` : ""}
      ${formBtns()}</form>`,
      after: l => {
        const form = $("#f-lpay", l);
        const upd = () => { const a = Core.num(form.amount.value), i = Core.num(form.interest.value); $("#lp-principal", l).value = nf.format(Core.round2(a - i)); };
        form.addEventListener("input", upd); upd();
        const del = $("#lp-del", l);
        if (del) del.onclick = () => confirmSheet("Удалить платёж?", `${rub(op.amount)} от ${fdate(op.date)}. Остаток долга и остаток счёта пересчитаются.`, "Удалить", () => {
          op.deleted = true; touch(op); log("Кредит", loanId, `Удалён платёж по кредиту «${loan.name}»: ${rub(op.amount)}`); sheets.pop(); commit("Платёж удалён");
        }, true);
        form.onsubmit = e => {
          e.preventDefault(); const v = formData(form);
          const amt = Core.round2(Core.num(v.amount)), intr = Core.round2(Core.num(v.interest));
          const err = $("#f-err", l);
          if (amt <= 0) { err.textContent = "Сумма должна быть больше нуля."; return; }
          if (intr < 0 || intr > amt) { err.textContent = "Проценты — от нуля до суммы платежа."; return; }
          if (!v.accountId) { err.textContent = "Выберите счёт."; return; }
          const rec = op || { id: Core.uid(), kind: "Платёж по кредиту", loanId };
          Object.assign(rec, { date: v.date || Core.today(), amount: amt, interest: intr, principal: Core.round2(amt - intr), accountId: v.accountId, note: v.note, category: "" });
          touch(rec); if (!op) S.ops.push(rec);
          log("Кредит", loanId, `${op ? "Изменён платёж" : "Платёж"} по кредиту «${loan.name}»: ${rub(amt)} (тело ${rub(rec.principal)}, проценты ${rub(intr)})`);
          sheets.pop(); commit();
        };
      } };
  };
}

/* ===================== ДРОП ===================== */
const DROP_STAGES = ["Рендер", "Прототип", "В работе", "Выдача"];
function renderDrops() {
  const list = [...D.DR.values()].sort((a, b) => (a.drop.closed ? 1 : 0) - (b.drop.closed ? 1 : 0) || ((a.drop.createdAt || "") < (b.drop.createdAt || "") ? 1 : -1));
  let people = 0, waiting = 0;
  list.forEach(x => { if (!x.drop.closed) { people += x.people; waiting += x.waiting; } });
  return `
    <div class="stats">
      ${stat(nf.format(people), "записалось на активные дропы", "users", "v-teal", "", "teal-ic")}
      ${stat(pcs(waiting), "ждут заказа", "clock", waiting ? "v-rust" : "", "")}
    </div>
    <div class="list">${list.length ? list.map(dropCard).join("") : `<div class="empty">Дропов пока нет. Дроп — это выпуск изделия: публикуешь рендер, собираешь записи, потом прототип и новые записи, а когда готово — превращаешь записи в заказы. Нажмите «Дроп» внизу справа.</div>`}</div>`;
}
function dropCard(x) {

function dropForm(id, presetItem) {

          touch(rec); if (!dr) S.drops.push(rec);

}
function dropAnnounce(x) {

/* ===================== ВЫСТАВКИ ===================== */
function showDates(sh) {
  if (!sh.dateFrom && !sh.dateTo) return "";
  if (sh.dateFrom && sh.dateTo && sh.dateFrom !== sh.dateTo) return `${fdate(sh.dateFrom)} — ${fdate(sh.dateTo)}`;
  return fdate(sh.dateFrom || sh.dateTo);
}
function renderShows() {
  const list = [...D.SH.values()].sort((a, b) => (a.show.closed ? 1 : 0) - (b.show.closed ? 1 : 0) || ((a.show.dateFrom || a.show.createdAt || "") < (b.show.dateFrom || b.show.createdAt || "") ? 1 : -1));
  let rev = 0, sold = 0, atStand = 0;
  list.forEach(x => { rev += x.revenue; sold += x.soldQty; if (!x.show.closed) x.items.forEach(r => (atStand += r.left)); });
  return `
    <div class="stats">
      ${stat(rub(rev), "выручка со всех выставок", "coins", "v-money", "", "money-ic")}
      ${stat(pcs(atStand), `сейчас на стендах, продано всего ${sold}`, "box", "v-teal", "", "teal-ic")}
    </div>
    <div class="list">${list.length ? list.map(showCard).join("") : `<div class="empty">Выставок пока нет. Нажмите «Выставка» внизу справа: возьмёте изделия со склада и будете продавать через кассу с калькулятором.</div>`}</div>`;
}
function showStatus(sh) {
  const t = Core.today();
  if (sh.closed) return "завершена";
  if (sh.dateFrom && sh.dateFrom > t) {
    const days = Math.round((new Date(sh.dateFrom) - new Date(t)) / 864e5);
    return days === 1 ? "завтра" : `через ${days} ${plural(days, "день", "дня", "дней")}`;
  }
  if (sh.dateTo && sh.dateTo < t) return "прошла";
  if (sh.dateFrom && sh.dateFrom <= t) return "идёт";
  return "идёт";
}
function showCard(x) {
  const sh = x.show;
  let left = 0; x.items.forEach(r => (left += r.left));
  return `<button class="card noimg" data-a="show" data-id="${sh.id}"><span class="body">
    <span class="row"><span class="name">${esc(sh.name)}</span><span class="pill round ${sh.closed ? "" : "green"}">${showStatus(sh)}</span></span>
    ${showDates(sh) ? `<span class="meta" style="display:block">${esc(showDates(sh))}</span>` : ""}
    ${x.takenQty ? `<span class="paybar" aria-hidden="true"><i style="width:${Math.min(100, x.soldQty / x.takenQty * 100)}%"></i></span>` : ""}
    <span class="totline"><span>Взято ${x.takenQty} · продано ${x.soldQty}${sh.closed ? "" : ` · на стенде ${left}`}</span><b class="num">${rub(x.revenue)}</b></span>
  </span></button>`;
}

function saleSheet(presetItem) {
  let cmode = "none";
  return () => {
    const items = [...D.I.values()].sort((a, b) => a.item.name.localeCompare(b.item.name, "ru"));
    if (!items.length) return { title: "Продажа", key: "sale-empty", html: `<div class="empty">Сначала добавьте изделие на склад.</div>` };
    const accs = Core.live(S.accounts);
    const first = presetItem || items[0].item.id;
    return { title: "Продажа", key: "sale" + (presetItem || ""), html: `<form id="f-sale"><section class="block">
      ${sel("Изделие *", "itemId", items.map(di => [di.item.id, `${di.item.name} (свободно ${Math.max(0, di.free)})`]), first)}
      <div class="grid2">${fld("Штук", "qty", 1, "number", 'min="1" step="1" inputmode="numeric"')}${fld("Цена за шт, ₽", "price", (find("items", first) || {}).price || "", "number")}</div>

      ${accs.length ? accountSelect("accountId", "Деньги на счёт") : `<p class="hint">Сначала добавьте счёт в разделе «Бюджет».</p>`}
      <div class="chips" style="margin:10px 0">
        <button type="button" data-cmode="none" aria-pressed="${cmode === "none"}">Без клиента</button>
        <button type="button" data-cmode="list" aria-pressed="${cmode === "list"}">Из списка</button>
        <button type="button" data-cmode="new" aria-pressed="${cmode === "new"}">Новый</button>
      </div>
      ${cmode === "none" ? `<p class="hint">Продажа запишется на «Розничные продажи».</p>` : clientPicker(cmode === "new" ? "new" : "list")}
      <div class="kv accent sep"><span>К оплате</span><span class="num" id="sale-total">—</span></div>
      <p class="hint">Изделие спишется со склада, деньги попадут на счёт, выручка — в бюджет.</p>
      </section><div id="f-err" class="err"></div>${formBtns("Продано")}</form>`,
      after: l => {
        const form = $("#f-sale", l);
        const calc = () => {
          const v = formData(form);
          const gross = Math.max(0, Math.round(Core.num(v.qty))) * Core.num(v.price);
          const disc = Math.min(gross, Core.num(v.discountSum));
          $("#sale-total", l).textContent = rub(gross - disc);
        };
        form.addEventListener("input", calc);
        form.addEventListener("change", e => {
          if (e.target.name === "itemId") { const it = find("items", e.target.value); if (it) form.price.value = it.price; }
          calc();
        });
        l.querySelectorAll("[data-cmode]").forEach(btn => (btn.onclick = e => { e.stopPropagation(); cmode = btn.dataset.cmode; renderSheet(); }));
        calc();
        form.onsubmit = e => {
          e.preventDefault();
          const v = formData(form);
          const err = $("#f-err", l);
          const q = Math.max(0, Math.round(Core.num(v.qty)));
          const price = Core.round2(Core.num(v.price));
          if (!v.itemId || q < 1) { err.textContent = "Выберите изделие и количество."; return; }
          if (price <= 0) { err.textContent = "Укажите цену."; return; }
          if (!v.accountId) { err.textContent = "Выберите счёт."; return; }
          let client;
          if (cmode === "none") client = retailBuyer();
          else { const r = resolveClient(v); if (r.error) { err.textContent = r.error; return; } client = r.client; }
          const di = D.I.get(v.itemId);
          if (di && Math.max(0, di.free) < q) { err.textContent = `Свободных готовых только ${Math.max(0, di.free)} шт. Отметьте «Готово» или уменьшите количество.`; return; }
          const gross = q * price, disc = Core.round2(Math.min(gross, Core.num(v.discountSum))), total = Core.round2(gross - disc);
          const order = touch({ id: Core.uid(), no: S.settings.nextOrderNo++, clientId: client.id, date: v.date || Core.today(), status: "Получен", discount: 0, discountSum: disc, pickup: "", note: "Продажа", recognizedAt: "" });
          S.orders.push(order);
          S.lines.push(touch({ id: Core.uid(), orderId: order.id, itemId: v.itemId, qty: q, price, costSnap: "" }));

function showTakeSheet(showId) {
  return () => {
    const x = D.SH.get(showId); if (!x) return null;
    const items = [...D.I.values()].filter(di => di.free > 0).sort((a, b) => a.item.name.localeCompare(b.item.name, "ru"));
    return { title: `Взять на «${x.show.name}»`, key: "take" + showId, html: `<form id="f-take">
      ${items.length ? items.map(di => { const row = x.items.get(di.item.id); return `<section class="block">
        <div class="row" style="display:flex;justify-content:space-between;gap:10px"><b>${esc(di.item.name)}</b><small class="hint" style="margin:0">свободно ${di.free}${row ? ` · уже взято ${row.taken}` : ""}</small></div>
        <div class="grid2">${fld("Взять, шт", "q_" + di.item.id, "", "number", `min="0" max="${di.free}" step="1" inputmode="numeric"`)}${fld("Цена на выставке, ₽", "p_" + di.item.id, row ? row.price : Core.num(di.item.price), "number")}</div>
      </section>`; }).join("") : `<div class="empty">Свободных готовых изделий нет.</div>`}
      <div id="f-err" class="err"></div>${items.length ? formBtns("Взять") : ""}</form>`,

        const form = $("#f-take", l);

          const picks = [];
          for (const di of items) {
            const q = Math.round(Core.num(v["q_" + di.item.id]));
            if (!q) continue;
            if (q < 0 || q > di.free) { err.textContent = `«${di.item.name}»: можно взять не больше ${di.free} шт.`; return; }
            picks.push([di, q, Core.round2(Core.num(v["p_" + di.item.id]))]);
          }
          if (!picks.length) { err.textContent = "Укажите, сколько штук взять."; return; }
          picks.forEach(([di, q, price]) => {
            const ex = S.showItems.find(si => !si.deleted && si.showId === showId && si.itemId === di.item.id);
            if (ex) { ex.qty = Core.num(ex.qty) + q; ex.price = price; touch(ex); }
            else S.showItems.push(touch({ id: Core.uid(), showId, itemId: di.item.id, qty: q, price }));
          });
          log("Выставка", showId, `На выставку «${x.show.name}» взято: ${picks.map(([di, q]) => `${di.item.name} ×${q}`).join(", ")}`);
          sheets.pop(); commit();
        };
      } };
  };
}
function showItemSheet(recId, showId) {

    const x = D.SH.get(showId); const row = x && x.items.get(si.itemId); const di = D.I.get(si.itemId);

        };

          sheets.pop(); commit();
        };
      } };
  };
}

  const buf = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  const stamp = new Date(); const pad = n => String(n).padStart(2, "0");
  const filename = `Верстак копия ${stamp.getFullYear()}-${pad(stamp.getMonth() + 1)}-${pad(stamp.getDate())} ${pad(stamp.getHours())}-${pad(stamp.getMinutes())}.xlsx`;
  const dl = await getDownloads();
  let ok = false;
  if (dl) {
    try { const r = await dl.save({ filename, data: new Blob([buf]) }); ok = r && r.status === "saved"; }
    catch (e) {
      const code = e && e.code;
      if (code === "declined") toast("Сохранение отменено.");
      else if (code === "rate_limited") toast("Окно сохранения уже открыто.");
      else toast("Не удалось сохранить файл" + (code ? ` (${code})` : "") + ".");
      return false;
    }
  } else {
    const mime = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
    const touch = window.matchMedia && matchMedia("(pointer: coarse)").matches;
    if (touch && typeof File === "function" && navigator.canShare) {
      try {
        const file = new File([buf], filename, { type: mime });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: filename });
          ok = true;
        }
      } catch (e) {
        if (e && e.name === "AbortError") { toast("Сохранение отменено."); return false; }
      }
    }
    if (!ok) try {
      const url = URL.createObjectURL(new Blob([buf], { type: mime }));
      const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      ok = true;
    } catch (e) { toast("Сохранение файлов в этом окне недоступно."); return false; }
  }
  if (ok) {
    S.settings.lastExportAt = Core.nowIso();
    log("Копия", "", `Выгружена копия: ${filename}`);
    save(); D = Core.derive(S); render();
    toast("Копия сохранена");
  }
  return ok;
}
function doImportPick() {
  const inp = $("#file-in");
  if (!inp) return;
  inp.value = "";
  inp.onchange = async () => {
    const file = inp.files && inp.files[0]; if (!file) return;
    if (!window.XLSX) { toast("Модуль Excel не загрузился. Проверьте интернет."); return; }
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array", cellDates: true });
      const book = {};
      wb.SheetNames.forEach(n => { book[n.trim()] = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: "", raw: true, blankrows: false }); });
      openSheet(importSheet(Core.fromSheets(book), file.name));
    } catch (e) { console.error(e); toast("Не удалось прочитать файл. Нужен .xlsx, выгруженный из приложения."); }
  };
  inp.click();
}
function importSheet(res, name) {
  return () => ({ title: "Загрузка из Excel", key: "import", html: `
    <p class="hint">Файл: ${esc(name)}</p>
    <section class="block"><h3>${ic("excel")}Что в файле</h3>${Object.entries(res.counts).map(([k, v]) => `<div class="kv"><span>${esc(k)}</span><span class="num">${v}</span></div>`).join("")}</section>
    ${res.errors.length ? `<section class="block"><h3 style="color:var(--red)">${ic("warn")}Ошибки — загрузка невозможна (${res.errors.length})</h3>${res.errors.slice(0, 50).map(x => `<p class="err">${esc(x)}</p>`).join("")}${res.errors.length > 50 ? `<p class="hint">…и ещё ${res.errors.length - 50}</p>` : ""}<p class="hint">Исправьте файл на компьютере и загрузите снова.</p></section>` : ""}
    ${res.warnings.length ? `<section class="block"><h3>Предупреждения</h3>${res.warnings.map(x => `<p class="hint">${esc(x)}</p>`).join("")}</section>` : ""}
    ${res.errors.length ? `<div class="btns"><button class="btn" data-a="close">Закрыть</button></div>` : `
      <section class="block"><p style="margin:0">Текущие данные в приложении будут полностью заменены содержимым файла.</p></section>
      <div class="btns g2"><button class="btn" id="imp-export">${ic("upload")}Сначала выгрузить текущие</button><button class="btn danger" id="imp-go">Заменить данные</button></div>`}`,
    after: l => {
      const ex = $("#imp-export", l); if (ex) ex.onclick = () => doExport();
      const go = $("#imp-go", l);
      if (go) go.onclick = () => {
        S = res.state;
        log("Копия", "", `Данные заменены из файла ${name}`);
        sheets.length = 0;
        commit(`Данные заменены из файла`);
      };
    } });
}

/* ---------- События ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a, id = el.dataset.id, v = el.dataset.v;
  if (a === "backdrop") { if (e.target === el) closeSheet(); return; }
  switch (a) {
    case "tab": view.tab = v; sheets.length = 0; render(); scrollTop0(); break;
    case "close": closeSheet(); break;
    case "stock-filter": view.stockFilter = v; render(); break;
    case "series-toggle": view.openSeries[v] = view.openSeries[v] === false; render(); break;
    case "order-filter": view.orderFilter = v; render(); break;
    case "omode": view.omode = v; render(); scrollTop0(); break;
    case "goto": {
      const [tab, sub] = v.split(":");
      view.tab = tab; sheets.length = 0;
      if (tab === "stock") view.stockFilter = sub;
      if (tab === "orders") { view.omode = "orders"; view.orderFilter = sub; }
      if (tab === "budget") view.btab = sub;
      render(); scrollTop0(); break;
    }
    case "series": sheets.length = 0; view.tab = "stock"; view.stockFilter = "all"; view.q = v; render(); scrollTop0(); break;
    case "item": openSheet(itemSheet(id)); break;
    case "item-form": openSheet(itemForm(id)); break;
    case "item-copy": {
      const src = find("items", id); if (!src) break;
      const copy = touch({ id: Core.uid(), name: src.name + " (копия)", series: src.series, material: src.material, coating: src.coating,
        matCost: Core.num(src.matCost), consCost: Core.num(src.consCost), price: Core.num(src.price), note: src.note, readyTotal: 0, madeAt: "" });
      S.items.push(copy);
      log("Изделие", copy.id, `Создан дубликат изделия «${src.name}»`);
      sheets.length = 0; commit();
      openSheet(itemForm(copy.id));
      break;
    }
    case "ready": openSheet(readySheet(id)); break;
    case "batch-form": openSheet(batchForm(el.dataset.item, id)); break;
    case "calendar": openSheet(calendarSheet()); break;
    case "copy-order": { const d = D.O.get(id); if (d) copyText(orderMessage(d), "Текст заказа скопирован"); break; }
    case "copy-ready": { const di = D.I.get(id); if (di) copyText(readyMessage(di.item, di), "Текст сообщения скопирован"); break; }
    case "bulk-ready": openSheet(bulkReadySheet()); break;
    case "sub-add": openSheet(subAddSheet(id)); break;
    case "sub-del": {
      const s = find("subs", id); if (!s) break;
      const c = find("clients", s.clientId);
      s.deleted = true; touch(s);
      log("Клиент", s.clientId, `Подписка снята: ${c ? c.name : ""} — ${s.kind === "серия" ? "серия " : ""}${esc(s.kind === "изделие" ? (find("items", s.ref) || {}).name || "" : s.ref)}`);
      commit(); break;
    }
    case "drop": openSheet(dropSheet(id)); break;
    case "drop-form": openSheet(dropForm(id, el.dataset.item)); break;
    case "signup-add": openSheet(signupSheet(id)); break;
    case "signup-del": {
      const su = find("signups", id); if (!su) break;
      const c = find("clients", su.clientId);
      confirmSheet("Убрать запись?", `${esc(c ? c.name : "")}, ${su.qty} шт. Созданный по ней заказ останется.`, "Убрать", () => {
        su.deleted = true; touch(su); log("Дроп", su.dropId, `Запись убрана: ${c ? c.name : ""}`); commit("Запись убрана");
      }, true);
      break;
    }
    case "drop-stage": {
      const dr = find("drops", id); if (!dr || dr.stage === v) break;
      const before = dr.stage || "—"; dr.stage = v; touch(dr);
      const x = D.DR.get(id);
      log("Дроп", id, `Дроп «${x && x.item ? x.item.name : ""}»: стадия «${before}» → «${v}»`); commit(); break;
    }
    case "drop-order": { const o = dropMakeOrder(id); if (o) { commit(); toast(`Создан заказ №${o.no}`); } break; }
    case "drop-orders-all": {
      const x = D.DR.get(id); if (!x) break;
      const list = x.signups.filter(s => !s.order || s.order.status === Core.CANCELLED);
      if (!list.length) break;
      confirmSheet("Создать заказы?", `По ${list.length} ${plural(list.length, "записи", "записям", "записям")} будут созданы заказы с ценой дропа и скидкой клиента.`, "Создать", () => {
        let n = 0; list.forEach(s => { if (dropMakeOrder(s.rec.id)) n++; });
        commit(); toast(`Создано заказов: ${n}`);
      });
      break;
    }
    case "drop-batch": {
      const x = D.DR.get(id); if (!x || !x.item) break;
      const di = D.I.get(x.item.id);
      const need = Math.max(0, x.qty - (di ? di.planned + Math.max(0, di.free) : 0));
      if (!need) break;
      S.batches.push(touch({ id: Core.uid(), itemId: x.item.id, qty: need, done: 0, due: x.drop.due || "", note: `дроп «${x.item.name}»` }));
      log("Изделие", x.item.id, `«${x.item.name}»: тираж ${need} шт под дроп${x.drop.due ? ` к ${fdate(x.drop.due)}` : ""}`);
      commit(); toast("Тираж создан"); break;
    }
    case "copy-drop": { const x = D.DR.get(id); if (x) copyText(dropAnnounce(x), "Анонс скопирован"); break; }
    case "copy-queue": { const x = D.DR.get(id); if (x) copyText(dropQueueText(x), "Список скопирован"); break; }
    case "show": openSheet(showSheet(id)); break;
    case "show-form": openSheet(showForm(id)); break;
    case "show-take": openSheet(showTakeSheet(id)); break;
    case "show-item": openSheet(showItemSheet(id, el.dataset.show)); break;
    case "show-sale-del": {
      const o = find("orders", id); if (!o) break;
      const d = D.O.get(id);
      confirmSheet("Удалить продажу?", `${rub(d ? d.total : 0)} от ${fdt(o.createdAt)}. Изделия вернутся на стенд, оплата удалится со счёта.`, "Удалить", () => {
        o.deleted = true; touch(o);
        S.lines.forEach(l => { if (l.orderId === id && !l.deleted) { l.deleted = true; touch(l); } });
        S.payments.forEach(p => { if (p.orderId === id && !p.deleted) { p.deleted = true; touch(p); } });
        log("Выставка", o.showId || "", `Удалена продажа на выставке: ${rub(d ? d.total : 0)}`); commit("Продажа удалена");
      }, true);
      break;
    }
    case "item-del": {
      const inUse = Core.live(S.lines).some(l => l.itemId === id && find("orders", l.orderId)) || Core.live(S.showItems).some(si => si.itemId === id && find("shows", si.showId));
      if (inUse) { toast("Изделие есть в заказах — удалить нельзя. Сначала уберите его из заказов."); break; }
      const it = find("items", id);
      confirmSheet("Удалить изделие?", `«${esc(it.name)}» пропадёт со склада. В выгрузке Excel запись останется с пометкой «Удалено».`, "Удалить", () => {
        it.deleted = true; touch(it);
        Core.live(S.subs).forEach(s => { if (s.kind === "изделие" && s.ref === id) { s.deleted = true; touch(s); } });
        log("Изделие", id, `Удалено изделие «${it.name}»`); sheets.length = 0; commit(`Удалено: ${it.name}`);
      }, true);
      break;
    }
    case "order": openSheet(orderSheet(id)); break;
    case "order-form": openSheet(orderForm(id, el.dataset.client)); break;
    case "order-status": {
      const o = find("orders", id); if (!o || o.status === v) break;
      const before = o.status; o.status = v; touch(o);
      log("Заказ", id, `Заказ №${o.no}: статус «${before}» → «${v}»`); commit(); break;
    }
    case "order-cancel": openSheet(cancelSheet(id)); break;
    case "order-return": openSheet(returnSheet(id)); break;
    case "sale": openSheet(saleSheet(id)); break;
    case "order-restore": {
      const o = find("orders", id); o.status = "Новый"; touch(o);
      log("Заказ", id, `Заказ №${o.no} возвращён в работу`); commit(); break;
    }
    case "order-del": {
      const o = find("orders", id);
      if (Core.live(S.payments).some(p => p.orderId === id)) { toast("По заказу есть оплаты. Удалите оплаты или отмените заказ."); break; }
      confirmSheet(`Удалить заказ №${o.no}?`, "Заказ, его строки и ожидаемые оплаты будут удалены. Для истории лучше «Отменить заказ».", "Удалить", () => {
        o.deleted = true; touch(o);
        S.lines.forEach(l => { if (l.orderId === id && !l.deleted) { l.deleted = true; touch(l); } });
        S.plans.forEach(p => { if (p.orderId === id && !p.deleted) { p.deleted = true; touch(p); } });
        S.ops.forEach(z => { if (z.orderId === id && !z.deleted) { z.deleted = true; touch(z); } });
        log("Заказ", id, `Удалён заказ №${o.no}`); sheets.length = 0; commit(`Удалён заказ №${o.no}`);
      }, true);
      break;
    }
    case "plan-shortage": openSheet(shortageSheet(id)); break;
    case "pay-form": openSheet(payForm(el.dataset.client, el.dataset.order)); break;
    case "plan-form": openSheet(planForm(el.dataset.client, el.dataset.order)); break;
    case "pay-del": {
      const p = find("payments", id);
      confirmSheet("Удалить оплату?", `${esc(p.kind)} ${rub(p.amount)} от ${fdate(p.date)}. Склад, выручка и долг пересчитаются.`, "Удалить", () => {
        p.deleted = true; touch(p); const c = find("clients", p.clientId);
        log("Оплата", id, `Удалена оплата ${rub(p.amount)} (${c ? c.name : ""})`); commit(`Удалена оплата ${rub(p.amount)}`);
      }, true);
      break;
    }
    case "plan-got": { const p = find("plans", id); openSheet(payForm(p.clientId, p.orderId, { fromPlan: id, amount: p.amount, orderId: p.orderId, note: p.note })); break; }
    case "plan-del": {
      const p = find("plans", id);
      confirmSheet("Удалить ожидаемую оплату?", `${rub(p.amount)}${p.date ? " к " + fdate(p.date) : ""}.`, "Удалить", () => {
        p.deleted = true; touch(p); log("Ожидаемая оплата", id, `Удалена ожидаемая оплата ${rub(p.amount)}`); commit("Ожидаемая оплата удалена");
      }, true);
      break;
    }
    case "client": openSheet(clientSheet(id)); break;
    case "client-form": openSheet(clientForm(id)); break;
    case "subs-form": openSheet(subsForm(id)); break;
    case "client-del": {
      const c = find("clients", id);
      if (Core.live(S.orders).some(o => o.clientId === id) || Core.live(S.payments).some(p => p.clientId === id)) { toast("У клиента есть заказы или оплаты — удалить нельзя."); break; }
      confirmSheet("Удалить клиента?", esc(c.name), "Удалить", () => {
        c.deleted = true; touch(c);
        S.subs.forEach(s => { if (s.clientId === id && !s.deleted) { s.deleted = true; touch(s); } });
        S.plans.forEach(p => { if (p.clientId === id && !p.deleted) { p.deleted = true; touch(p); } });
        log("Клиент", id, `Удалён клиент ${c.name}`); sheets.length = 0; commit(`Удалён клиент ${c.name}`);
      }, true);
      break;
    }
    case "size": applySize(v); render(); break;
    case "theme": applyTheme(v); render(); break;
    case "btab": view.btab = v; render(); break;
    case "ym": view.ym = Core.shiftYm(view.ym, +v); render(); break;
    case "op-filter": view.opFilter = v; render(); break;
    case "op-form": openSheet(opForm(id, v, el.dataset.show)); break;
    case "op": openSheet(opSheet(id)); break;
    case "account": openSheet(accountSheet(id)); break;
    case "account-form": openSheet(accountForm(id)); break;
    case "install-help": openSheet(installSheet()); break;
    case "export": doExport(); break;
    case "import": doImportPick(); break;
    case "wipe":
      confirmSheet("Стереть все данные?", "Склад, клиенты, заказы, оплаты и журнал будут удалены с этого телефона. Отменить нельзя. Сначала выгрузите копию.", "Стереть", () => {
        const before = snapshot();
        S = Core.emptyState(); Core.migrate(S); sheets.length = 0; save(); D = Core.derive(S); prevSnap = snapshot(); render();
        toastUndo("Данные стёрты", before);
      }, true);
      break;
  }
});
document.addEventListener("input", e => {
  const k = e.target.dataset && e.target.dataset.in;
  if (!k) return;
  view[k] = e.target.value;
  const box = document.getElementById("list-" + k);
  if (box) box.innerHTML = k === "q" ? stockList() : k === "oq" ? orderList() : clientList();
});
document.addEventListener("submit", e => {
  if (e.target.id !== "f-settings") return;
  e.preventDefault();
  const v = formData(e.target);
  const lines = x => x.split("\n").map(s => s.trim()).filter(Boolean);
  const st = S.settings;
  const changes = [];
  st.remindDays = Math.max(1, Math.round(Core.num(v.remindDays)) || 7);
  st.series = lines(v.series);
  const ec = lines(v.expenseCats); if (ec.length) st.expenseCats = ec;
  const icx = lines(v.incomeCats); if (icx.length) st.incomeCats = icx;
  const tp = Core.num(v.taxPct); if (tp !== Core.num(st.taxPct)) changes.push(`налог ${st.taxPct}% → ${tp}%`);
  st.taxPct = Math.max(0, Math.min(100, tp)); st.taxBase = v.taxBase === "revenue" ? "revenue" : "cash";
  log("Настройки", "", "Настройки сохранены" + (changes.length ? ": " + changes.join(", ") : ""));
  commit(); toast("Настройки сохранены");
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && sheets.length) closeSheet(); });

/* ---------- Старт ---------- */
S = load();
const migNotes = Core.migrate(S);
migNotes.forEach(n => log("Бюджет", "", n));
if (migNotes.length) save();
const startNotes = Core.reconcile(S);
if (startNotes.length) { startNotes.forEach(n => log(n.entity, n.entityId, n.text)); save(); }
D = Core.derive(S);
prevSnap = snapshot();
render();
if (window.claude && typeof window.claude.use === "function") getDownloads();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost") && !window.claude) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
})();
