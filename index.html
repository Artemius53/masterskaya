<style>
:root{
  --bg:#EFE5D8; --card:#FAF3E8; --row:#FFFCF6; --chip:#E9DCCB; --ink:#3B2F26; --muted:#8A7969; --line:#E0D1BE;
  --teal:#8A5C3C; --teal-ink:#7A4F32; --on-teal:#FFF8F0;
  --money:#A1732C; --rust:#B0623C; --reserve-ink:#5F6F7E; --red:#AE4A38;
  --c-plan:#BCAB96; --c-wip:#D9A05B; --c-ready:#7E9060; --c-res:#6F8296; --c-sold:#B5876B;
  --b-red:#F2DED6; --b-green:#E2E8D5; --b-blue:#DFE5EA; --t-blue:#4E6072; --b-orange:#F5E4CE; --t-orange:#9A612A; --b-money:#F3E5C8; --b-grey:#EADFD0;
  --banner:#F0DDB2; --banner-btn:#BA9053;
  --r-card:18px; --r-ctl:12px;
  --font:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171210; --card:#221B16; --row:#2A211B; --chip:#33271F; --ink:#EEE3D5; --muted:#A69686; --line:#392D24;
    --teal:#A5714A; --teal-ink:#D0A275; --on-teal:#FFF8F0;
    --money:#D7AC68; --rust:#D98A5F; --reserve-ink:#9DB2C6; --red:#DE8570;
    --c-plan:#8D7E6C; --c-wip:#D19A5C; --c-ready:#8CA06B; --c-res:#7F93A8; --c-sold:#C08E6C;
    --b-red:#412620; --b-green:#28301F; --b-blue:#222C34; --t-blue:#A9C2D6; --b-orange:#3D2C1C; --t-orange:#E8B57E; --b-money:#3A2E1B; --b-grey:#2E241D;
    --banner:#3B2F1B; --banner-btn:#A9803F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171210; --card:#221B16; --row:#2A211B; --chip:#33271F; --ink:#EEE3D5; --muted:#A69686; --line:#392D24;
  --teal:#A5714A; --teal-ink:#D0A275; --on-teal:#FFF8F0;
  --money:#D7AC68; --rust:#D98A5F; --reserve-ink:#9DB2C6; --red:#DE8570;
  --c-plan:#8D7E6C; --c-wip:#D19A5C; --c-ready:#8CA06B; --c-res:#7F93A8; --c-sold:#C08E6C;
  --b-red:#412620; --b-green:#28301F; --b-blue:#222C34; --t-blue:#A9C2D6; --b-orange:#3D2C1C; --t-orange:#E8B57E; --b-money:#3A2E1B; --b-grey:#2E241D;
  --banner:#3B2F1B; --banner-btn:#A9803F;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:14px}
html[data-size="m"]{font-size:15px}
html[data-size="l"]{font-size:16px}
body{font-size:1rem}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.35;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
svg.i{width:1.375rem;height:1.375rem;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num,.money,.price{font-variant-numeric:tabular-nums}
.money{color:var(--money)}
.wrap{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:640px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 14px calc(7rem + env(safe-area-inset-bottom))}
header.top{padding:18px 4px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.hbtn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--card);color:var(--teal-ink);border-radius:999px;padding:.5rem .85rem;font-weight:600;font-size:.9rem;cursor:pointer;flex:none}
.hbtn .i{width:1.2rem;height:1.2rem}
header.top h1{min-width:0;margin:0;font-size:2.35rem;line-height:1.05;font-weight:800;letter-spacing:-.025em}

/* плашка копии */
.banner{display:flex;gap:12px;align-items:center;background:var(--banner);border-radius:var(--r-card);padding:10px 10px 10px 14px;margin-bottom:12px;font-size:.95rem;font-weight:500}
.banner span{flex:1}
.banner .btn{background:var(--banner-btn);border-color:transparent;color:#1B1407;font-weight:600;padding:9px 16px}
.banner.danger{background:var(--b-red)}

/* показатели */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{display:flex;align-items:center;gap:10px;background:var(--card);border:0;border-radius:var(--r-card);padding:.7rem .6rem .7rem .75rem;text-align:left;min-height:4.6rem;width:100%}
button.stat{cursor:pointer}
.stat .i{width:1.75rem;height:1.75rem;color:var(--ink);stroke-width:1.6}
.stat .money-ic{color:var(--money)} .stat .teal-ic{color:var(--reserve-ink)}
.stat .t{flex:1;min-width:0}
.stat b{display:block;font-size:clamp(1.1rem,5.4vw,1.45rem);font-weight:700;line-height:1.1;letter-spacing:-.01em;white-space:nowrap}
.stat span{display:block;font-size:.84rem;color:var(--muted);margin-top:3px}
.stat .chev{width:16px;height:16px;color:var(--muted)}
.v-money{color:var(--money)} .v-teal{color:var(--reserve-ink)} .v-rust{color:var(--rust)} .v-red{color:var(--red)}
.stat span.v-red{color:var(--red)}

/* фильтры и поиск */
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:0;background:var(--card);border-radius:999px;padding:9px 16px;font-size:.93rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--on-teal);font-weight:600}
.searchbox{position:relative;margin-bottom:14px}
.searchbox .i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search{width:100%;padding:.75rem 14px .75rem 2.9rem;border:0;border-radius:var(--r-card);background:var(--card);font-size:16px}
.search::placeholder{color:var(--muted)}

/* карточки */
.list{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:auto 1fr;gap:12px;width:100%;text-align:left;background:var(--card);border:0;border-radius:var(--r-card);padding:10px 12px 12px 10px;cursor:pointer}
.card.noimg{grid-template-columns:1fr}
.card .body{min-width:0}
.card .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card .name{font-weight:700;font-size:1.05rem}
.card .price{white-space:nowrap;font-size:1.45rem;font-weight:700;color:var(--money);line-height:1.2;margin-top:2px}
.card .meta{color:var(--muted);font-size:.9rem;margin-top:2px}
.card .side{text-align:right;flex:none}
.card .side small{display:block;color:var(--muted);font-size:.8rem}
.card .side b{white-space:nowrap;display:block;color:var(--money);font-size:1.3rem;font-weight:700}
.card .flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* плитка материала вместо фото */
.tile{display:flex;align-items:center;justify-content:center;border-radius:12px;color:#fff;font-weight:700;letter-spacing:.02em;text-shadow:0 1px 1px rgba(0,0,0,.25);flex:none}
.tile.s{width:3.8rem;height:3.8rem;font-size:1.1rem}
.tile.m{width:4.6rem;height:5.4rem;font-size:1.3rem;align-self:start}
.tile.l{width:6.8rem;height:6.8rem;font-size:1.9rem}
.tile.xs{width:2.8rem;height:2.8rem;font-size:.9rem;border-radius:10px}
.tile.avatar{border-radius:50%;background:var(--chip);color:var(--ink);text-shadow:none}

/* слиток */
.ingot{display:flex;gap:2px;height:13px;margin-top:12px;border-radius:7px;overflow:hidden;background:var(--chip)}
.ingot i{display:block;height:100%}
.ingot .p{background:var(--c-plan)} .ingot .w{background:var(--c-wip)} .ingot .f{background:var(--c-ready)} .ingot .r{background:var(--c-res)} .ingot .s{background:var(--c-sold)}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.counts div{min-width:0}
.counts b{font-size:1.02rem;font-weight:700}
.counts small{display:block;color:var(--muted);font-size:.74rem;line-height:1.15;padding-left:14px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:1px}
.d-p{background:var(--c-plan)} .d-w{background:var(--c-wip)} .d-f{background:var(--c-ready)} .d-r{background:var(--c-res)} .d-s{background:var(--c-sold)} .d-x{background:var(--red)}

/* метки */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:6px 10px;font-size:.88rem;white-space:nowrap;background:var(--b-grey);color:var(--ink)}
.pill .i{width:18px;height:18px}
.pill.red{background:var(--b-red);color:var(--red)} .pill.green{background:var(--b-green);color:var(--reserve-ink)}
.pill.money{background:var(--b-money);color:var(--money)} .pill.blue{background:var(--b-blue);color:var(--t-blue)} .pill.orange{background:var(--b-orange);color:var(--t-orange)}
.pill.round{border-radius:999px;padding:5px 14px}
.pill b{font-weight:700}

.fab{position:fixed;right:max(14px,calc(50% - 306px));bottom:calc(4.8rem + env(safe-area-inset-bottom));z-index:6;width:4.9rem;height:4.9rem;border:0;border-radius:50%;background:var(--teal);color:var(--on-teal);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:.82rem;font-weight:500;box-shadow:0 8px 20px rgba(8,50,52,.3);cursor:pointer}
.fab .i{width:1.75rem;height:1.75rem;stroke-width:2}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs::after{content:"";position:absolute;left:0;right:0;top:100%;height:100vh;background:var(--card)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.8rem;color:var(--muted);cursor:pointer}
nav.tabs button .i{width:1.5rem;height:1.5rem}
nav.tabs button[aria-current="page"]{color:var(--teal-ink);font-weight:600}

.empty{padding:32px 12px;text-align:center;color:var(--muted);background:var(--card);border-radius:var(--r-card)}
.empty .btn{margin-top:12px}

/* лист */
.sheet-back{position:fixed;inset:0;z-index:20;background:rgba(8,14,13,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92dvh;border-radius:22px 22px 0 0;display:flex;flex-direction:column}
.grab{width:40px;height:5px;border-radius:3px;background:var(--c-plan);opacity:.55;margin:8px auto 0}
.sheet-head{display:grid;grid-template-columns:90px 1fr 90px;align-items:center;padding:6px 10px 10px}
.sheet-head h2{margin:0;font-size:1.15rem;font-weight:700;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-head .close{border:0;background:none;color:var(--teal-ink);font-weight:500;font-size:1rem;text-align:left;padding:8px 6px;cursor:pointer}
.sheet-body{overflow-y:auto;padding:4px 12px calc(20px + env(safe-area-inset-bottom))}

section.block{background:var(--card);border-radius:var(--r-card);padding:12px 14px;margin-bottom:10px}
section.block > h3{display:flex;align-items:center;gap:10px;margin:0 0 8px;font-size:1.02rem;font-weight:700}
section.block > h3 .i{width:1.4rem;height:1.4rem}
.kv{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:.97rem}
.kv > span:first-child{color:var(--muted)}
.kv > span:last-child{white-space:nowrap;text-align:right}
.kv.strong > span{color:var(--ink);font-weight:700}
.kv.accent > span{color:var(--money);font-weight:700;font-size:1.05rem}
.kv.sep{border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.indent{padding-left:34px}

.rowlink{display:flex;align-items:center;gap:10px;width:100%;background:var(--row);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px;text-align:left;cursor:pointer;min-height:52px}
.rowlink .l{flex:1;min-width:0}
.rowlink .l small{display:block;color:var(--muted);font-size:.84rem}
.rowlink .l b{font-weight:600}
.rowlink .chev{width:16px;height:16px;color:var(--muted)}
.rowlink.plain{cursor:default}
.withtile{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;margin-top:8px}
.withtile .rowlink{margin-top:0}
.tel{display:inline-flex;align-items:center;gap:6px;color:var(--teal-ink);text-decoration:none;font-weight:500;white-space:nowrap}
.tel .i{width:20px;height:20px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--row);border-radius:var(--r-ctl);padding:.7rem .85rem;cursor:pointer;font-weight:500;font-size:.98rem;min-height:44px}
.btn .i{width:1.3rem;height:1.3rem}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.btn.outline{background:transparent;border-color:var(--teal);color:var(--teal-ink)}
.btn.danger{background:transparent;border-color:var(--red);color:var(--red)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.small{padding:7px 12px;min-height:38px;font-size:.9rem;gap:6px}
.btn.small .i{width:18px;height:18px}
.btn.textred{border:0;background:none;color:var(--red);min-height:38px;padding:6px 4px;font-size:.92rem;gap:6px}
.btn.textred .i{width:20px;height:20px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.btns > .btn{flex:1 1 0}
.btns.g2{display:grid;grid-template-columns:1fr 1fr}
.btns.g3{display:grid;grid-template-columns:repeat(3,1fr)}
.btns.g3 .btn{padding:10px 6px;font-size:.86rem;gap:5px;line-height:1.15}
.btns.g3 .btn .i{width:20px;height:20px}
.btns.bottom{margin:14px 0 4px}
:focus-visible{outline:2px solid var(--teal-ink);outline-offset:2px}

/* строки оплат */
.payrow{display:flex;align-items:center;gap:10px;background:var(--row);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px;margin-top:8px}
.payrow b{font-size:1.05rem;white-space:nowrap}
.payrow .l{flex:1;min-width:0;color:var(--muted);font-size:.84rem;display:flex;flex-direction:column;gap:1px}
.payrow .l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.payrow .acts{display:flex;align-items:center;gap:6px;border-left:1px solid var(--line);padding-left:8px}
.btn.got{background:var(--teal);color:var(--on-teal);border-color:var(--teal);min-height:36px;padding:6px 10px;font-size:.9rem;gap:6px}
.btn.got .i{width:18px;height:18px}

/* верх карточки изделия */
.hero{margin:2px 4px 12px}
.hero .price{font-size:2rem;font-weight:700;color:var(--money);line-height:1.1}
.hero .meta{color:var(--muted);margin-top:4px}
.hero .mg{margin-top:8px;color:var(--muted);font-size:.9rem}
.hero .mg b{color:var(--money);font-size:1.35rem;font-weight:700;margin-left:4px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin-top:10px;font-size:.9rem}
.legend .col > div{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.legend > div span{color:var(--ink)}
.legend b{font-weight:700}
.legend .col{display:flex;flex-direction:column;gap:5px}
.legend .col + .col{border-left:1px solid var(--line);padding-left:14px}
.inforow{display:flex;align-items:center;gap:10px;background:var(--chip);border-radius:12px;padding:11px 12px;margin-top:10px;width:100%;border:0;text-align:left;cursor:pointer;font-size:.98rem}
.inforow span{flex:1}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:0;background:var(--chip);border-radius:12px;padding:9px 13px;font-size:.92rem;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--teal);color:var(--on-teal)}
.chips button:disabled{opacity:.5}

.lineitem{display:block;margin-top:8px}
.lineitem .top{display:flex;justify-content:space-between;gap:10px}
.lineitem .top b{font-weight:600}
.lineitem small{color:var(--muted);display:block}
.lineitem .flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

.client-head{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.client-head .tile{width:5.2rem;height:5.2rem}
.client-head .tile .i{width:2.4rem;height:2.4rem}
.ctable{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.95rem}
.ctable > span:nth-child(odd){color:var(--muted)}

/* формы */
label.f{display:block;margin-bottom:10px;font-size:.88rem;color:var(--muted)}
label.f{min-width:0}
label.f input,label.f select,label.f textarea{display:block;width:100%;max-width:100%;min-width:0;margin-top:5px;padding:0 .8rem;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--row);color:var(--ink);font-size:16px;line-height:1.2}
label.f input,label.f select{height:46px}
label.f textarea{padding:.65rem .8rem}
label.f input[type="date"]{-webkit-appearance:none;appearance:none;text-align:left;display:flex;align-items:center}
label.f input[type="date"]::-webkit-date-and-time-value{text-align:left;margin:0}
label.f input[type="date"]::-webkit-calendar-picker-indicator{margin-left:auto}
label.f select{-webkit-appearance:none;appearance:none;padding-right:2.2rem;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238F969A' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m7 10 5 5 5-5'/></svg>");background-repeat:no-repeat;background-position:right .7rem center;background-size:18px}
label.f textarea{min-height:110px;resize:vertical;line-height:1.45}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 10px;align-items:end}
.grid2 > *{min-width:0}
.grid3{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1fr) auto;gap:0 8px;align-items:end}
.grid3 > *{min-width:0}
.grid3 label.f:first-child{grid-column:1/-1}
.hint{font-size:.86rem;color:var(--muted);margin:6px 0 10px}
.check{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:.97rem}
.check input{width:20px;height:20px;accent-color:var(--teal)}
.err{color:var(--red);font-size:.9rem;margin:4px 0}
.linebox{background:var(--row);border:1px solid var(--line);border-radius:14px;padding:10px 10px 0;margin-bottom:8px}
.sect-title{font-size:1rem;font-weight:700;margin:14px 0 8px}

/* журнал */
.logrow{display:grid;grid-template-columns:5.6rem auto 1fr;gap:10px;align-items:center;background:var(--row);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px;font-size:.92rem}
.logrow time{color:var(--muted);font-size:.8rem;line-height:1.3}

</style></head><body><div id="app"></div><script>
/* ===== CORE: данные, расчёты, цепочки ===== */
const Core = (() => {
  const FORMAT_VERSION = 5;
  const STATUSES = ["Новый", "В работе", "Готов", "Отправлен", "Получен", "Отменён"];
  const CANCELLED = "Отменён";

  function uid() {
    const a = new Uint8Array(9);
    (globalThis.crypto || require("crypto").webcrypto).getRandomValues(a);
    return Array.from(a, b => (b % 36).toString(36)).join("") + Date.now().toString(36).slice(-3);
  }
  const nowIso = () => new Date().toISOString();
  function today() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  const num = v => {
    if (v === null || v === undefined || v === "") return 0;
    if (typeof v === "number") return isFinite(v) ? v : 0;
    const n = parseFloat(String(v).replace(/\s| /g, "").replace(",", "."));
    return isFinite(n) ? n : 0;
  };
  const round2 = n => Math.round(n * 100) / 100;

  function emptyState() {
    return {
      v: FORMAT_VERSION,
      settings: {
        remindDays: 7,
        nextOrderNo: 1,
        lastExportAt: null,
        series: [],
        methods: ["Наличные", "Карта", "Перевод"],
        taxPct: 0,
        taxBase: "cash",
        expenseCats: ["Материалы", "Расходники", "Инструмент", "Доставка", "Реклама", "Комиссии площадок", "Налоги", "Прочее"],
        incomeCats: ["Прочий доход"]
      },
      items: [], clients: [], subs: [], orders: [], lines: [], payments: [], plans: [], log: [],
      accounts: [], ops: [], loans: [], batches: [], shows: [], showItems: [], drops: [], signups: []
    };
  }

  const live = arr => arr.filter(r => !r.deleted);
  const byId = arr => { const m = new Map(); arr.forEach(r => m.set(r.id, r)); return m; };

  function itemCost(item, settings) {
    return round2(num(item.matCost) + num(item.consCost));
  }

  /* --- Главный расчёт. Ничего не меняет в state. --- */
  function derive(state) {
    const s = state.settings;
    const items = live(state.items), clients = live(state.clients), orders = live(state.orders);
    const itemMap = byId(items), clientMap = byId(clients), orderMap = byId(orders);
    const lines = live(state.lines).filter(l => orderMap.has(l.orderId));
    const payments = live(state.payments), plans = live(state.plans);

    const O = new Map(); // orderId -> расчёт
    orders.forEach(o => {
      O.set(o.id, { order: o, lines: [], gross: 0, discountAmt: 0, total: 0, paid: 0, planned: 0,
        fullAlloc: false, shortage: 0, recognizable: false, cost: 0, margin: 0 });
    });
    lines.forEach(l => {
      const d = O.get(l.orderId);
      d.lines.push({ line: l, alloc: 0 });
      d.gross += num(l.qty) * num(l.price);
    });
    payments.forEach(p => {
      if (p.orderId && O.has(p.orderId)) O.get(p.orderId).paid += signed(p);
    });
    plans.forEach(p => {
      if (p.orderId && O.has(p.orderId)) O.get(p.orderId).planned += num(p.amount);
    });
    O.forEach(d => {
      d.gross = round2(d.gross);
      d.discountAmt = num(d.order.discountSum) > 0 ? round2(Math.min(d.gross, num(d.order.discountSum))) : round2(d.gross * num(d.order.discount) / 100);
      d.total = round2(d.gross - d.discountAmt);
      d.paid = round2(d.paid);
    });

    // Распределение готовых изделий по заказам: сначала уже проданные, затем по дате создания
    const pool = new Map();
    items.forEach(i => pool.set(i.id, num(i.readyTotal)));
    const queue = orders.filter(o => o.status !== CANCELLED).sort((a, b) => {
      if (!!a.recognizedAt !== !!b.recognizedAt) return a.recognizedAt ? -1 : 1;
      if (!!a.showId !== !!b.showId) return a.showId ? -1 : 1; // продажа с выставки: изделие уже у покупателя
      const ka = a.recognizedAt || a.createdAt || "", kb = b.recognizedAt || b.createdAt || "";
      return ka < kb ? -1 : ka > kb ? 1 : 0;
    });
    queue.forEach(o => {
      const d = O.get(o.id);
      let full = d.lines.length > 0;
      d.lines.forEach(x => {
        const q = num(x.line.qty);
        const avail = Math.max(0, pool.get(x.line.itemId) || 0);
        x.alloc = Math.min(q, avail);
        pool.set(x.line.itemId, avail - x.alloc);
        if (x.alloc < q) { full = false; d.shortage += q - x.alloc; }
      });
      d.fullAlloc = full;
      d.recognizable = full && d.paid >= d.total - 0.005;
    });

    // Расходы, привязанные к заказу (доставка и т. п.)
    const orderExpense = new Map();
    live(state.ops || []).forEach(op => {
      if (op.kind !== "Расход" || !op.orderId) return;
      orderExpense.set(op.orderId, round2((orderExpense.get(op.orderId) || 0) + num(op.amount)));
    });
    // Себестоимость и маржа
    O.forEach(d => {
      const k = d.gross > 0 ? d.total / d.gross : 0;
      let cost = 0, rev = 0;
      d.lines.forEach(x => {
        const it = itemMap.get(x.line.itemId);
        const c = d.order.recognizedAt && x.line.costSnap !== "" && x.line.costSnap != null
          ? num(x.line.costSnap) : (it ? itemCost(it, s) : 0);
        x.unitCost = c;
        cost += c * num(x.line.qty);
        rev += num(x.line.qty) * num(x.line.price) * k;
      });
      d.cost = round2(cost);
      d.extraCost = orderExpense.get(d.order.id) || 0;
      d.margin = round2(rev - cost - d.extraCost);
    });

    // Выставки: взято, продано, осталось на стенде
    const shows = live(state.shows || []);
    const showMap = byId(shows);
    const SH = new Map();
    shows.forEach(sh => SH.set(sh.id, { show: sh, items: new Map(), takenQty: 0, takenSum: 0, soldQty: 0, revenue: 0, margin: 0, orders: [] }));
    live(state.showItems || []).forEach(si => {
      const x = SH.get(si.showId); if (!x || !itemMap.has(si.itemId)) return;
      const row = x.items.get(si.itemId) || { rec: si, itemId: si.itemId, taken: 0, sold: 0, price: num(si.price) };
      row.taken += Math.round(num(si.qty)); row.rec = si; row.price = num(si.price);
      x.items.set(si.itemId, row);
    });
    O.forEach(d => {
      const sid = d.order.showId; if (!sid || !SH.has(sid) || d.order.status === CANCELLED) return;
      const x = SH.get(sid); x.orders.push(d);
      x.revenue += d.total; x.margin += d.margin;
      d.lines.forEach(l => { const row = x.items.get(l.line.itemId); x.soldQty += num(l.line.qty); if (row) row.sold += num(l.line.qty); });
    });
    live(state.ops || []).forEach(op => {
      if (op.kind !== "Расход" || !op.showId) return;
      const x = SH.get(op.showId); if (!x) return;
      x.expenses = round2((x.expenses || 0) + num(op.amount));
    });
    const atShow = new Map();
    SH.forEach(x => {
      x.expenses = x.expenses || 0;
      x.items.forEach(row => {
        row.left = Math.max(0, row.taken - row.sold);
        x.takenQty += row.taken; x.takenSum += row.taken * row.price;
        if (!x.show.closed) atShow.set(row.itemId, (atShow.get(row.itemId) || 0) + row.left);
      });
      x.revenue = round2(x.revenue); x.margin = round2(x.margin); x.takenSum = round2(x.takenSum);
      x.profit = round2(x.margin - x.expenses);
      x.orders.sort((a, b) => ((a.order.createdAt || "") < (b.order.createdAt || "") ? 1 : -1));
    });

    // Склад
    const I = new Map();
    items.forEach(i => I.set(i.id, { item: i, cost: itemCost(i, s), reserved: 0, sold: 0, shortage: 0, free: 0, planned: 0, batches: [], nextDue: "", overdue: false }));
    const t0 = today();
    live(state.batches || []).forEach(b => {
      const di = I.get(b.itemId); if (!di) return;
      const open = Math.max(0, Math.round(num(b.qty)) - Math.round(num(b.done)));
      di.batches.push({ batch: b, open });
      if (open > 0) {
        di.planned += open;
        if (b.due && (!di.nextDue || b.due < di.nextDue)) di.nextDue = b.due;
        if (b.due && b.due < t0) di.overdue = true;
      }
    });
    I.forEach(di => di.batches.sort((a, b) => ((a.batch.due || "9999") < (b.batch.due || "9999") ? -1 : 1)));
    O.forEach(d => {
      if (d.order.status === CANCELLED) return;
      d.lines.forEach(x => {
        const di = I.get(x.line.itemId); if (!di) return;
        if (d.order.recognizedAt) di.sold += x.alloc; else di.reserved += x.alloc;
        if (!d.order.recognizedAt) di.shortage += num(x.line.qty) - x.alloc;
      });
    });
    I.forEach(di => {
      di.free = num(di.item.readyTotal) - di.reserved - di.sold - (atShow.get(di.item.id) || 0);
      di.atShow = atShow.get(di.item.id) || 0;
      di.margin = round2(num(di.item.price) - di.cost);
      di.onHand = num(di.item.readyTotal) - di.sold;
      di.totalQty = di.planned + Math.max(0, di.onHand);
    });

    // Дропы: записи и заказы по ним
    const drops = live(state.drops || []);
    const DR = new Map();
    drops.forEach(dr => DR.set(dr.id, { drop: dr, item: itemMap.get(dr.itemId) || null, signups: [], people: 0, qty: 0, ordered: 0, waiting: 0 }));
    live(state.signups || []).forEach(su => {
      const x = DR.get(su.dropId); if (!x) return;
      const order = su.orderId ? orderMap.get(su.orderId) : null;
      const q = Math.max(1, Math.round(num(su.qty)));
      x.signups.push({ rec: su, client: clientMap.get(su.clientId) || null, qty: q, order });
      x.people += 1; x.qty += q;
      if (order && order.status !== CANCELLED) x.ordered += q; else x.waiting += q;
    });
    DR.forEach(x => x.signups.sort((a, b) => ((a.rec.date || a.rec.createdAt || "") < (b.rec.date || b.rec.createdAt || "") ? -1 : 1)));

    // Клиенты
    const C = new Map();
    const t = today();
    clients.forEach(c => C.set(c.id, { client: c, paid: 0, debt: 0, expected: 0, overdue: 0, active: [], past: [], cancelled: [] }));
    payments.forEach(p => { const dc = C.get(p.clientId); if (dc) dc.paid += signed(p); });
    plans.forEach(p => {
      const dc = C.get(p.clientId); if (!dc) return;
      dc.expected += num(p.amount);
      if (p.date && p.date < t) dc.overdue += num(p.amount);
    });
    O.forEach(d => {
      const dc = C.get(d.order.clientId); if (!dc) return;
      if (d.order.status === CANCELLED) { dc.cancelled.push(d); return; }
      if (d.total - d.paid > 0.005) dc.debt += d.total - d.paid;
      const done = d.order.recognizedAt && d.order.status === "Получен";
      (done ? dc.past : dc.active).push(d);
    });
    C.forEach(dc => { dc.paid = round2(dc.paid); dc.debt = round2(dc.debt); dc.expected = round2(dc.expected); dc.overdue = round2(dc.overdue); });

    // Итоги
    const month = t.slice(0, 7);
    let revenueMonth = 0, marginMonth = 0, advances = 0;
    O.forEach(d => {
      if (d.order.status === CANCELLED) return;
      if (d.order.recognizedAt && d.order.recognizedAt.slice(0, 7) === month) { revenueMonth += d.total; marginMonth += d.margin; }
      if (!d.order.recognizedAt && d.paid > 0) advances += Math.min(d.paid, d.total);
    });
    let stockValue = 0;
    I.forEach(di => { if (di.free > 0) stockValue += di.free * num(di.item.price); });

    return { O, I, C, SH, DR, showMap, itemMap, clientMap, orderMap,
      totals: { revenueMonth: round2(revenueMonth), marginMonth: round2(marginMonth), advances: round2(advances), stockValue: round2(stockValue) } };
  }

  function signed(p) { return p.kind === "Возврат" ? -num(p.amount) : num(p.amount); }

  /* --- Переход со старых данных: счета вместо «способа оплаты» --- */
  function migrate(state) {
    const def = emptyState();
    ["accounts", "ops", "loans", "batches", "shows", "showItems", "drops", "signups"].forEach(t => { if (!Array.isArray(state[t])) state[t] = []; });
    if (!state.settings || typeof state.settings !== "object") state.settings = {};
    Object.keys(def.settings).forEach(key => { if (state.settings[key] === undefined) state.settings[key] = def.settings[key]; });
    ["items", "clients", "subs", "orders", "lines", "payments", "plans", "log"].forEach(t => { if (!Array.isArray(state[t])) state[t] = []; });
    const notes = [];
    const accByName = name => state.accounts.find(a => !a.deleted && a.name.toLowerCase() === String(name).toLowerCase());
    const ensure = name => {
      let a = accByName(name);
      if (!a) { a = { id: uid(), name, opening: 0, openingDate: "", note: "", createdAt: nowIso(), updatedAt: nowIso() }; state.accounts.push(a); notes.push(`Создан счёт «${name}»`); }
      return a;
    };
    const needs = state.payments.filter(p => !p.accountId);
    if (!live(state.accounts).length) ensure("Наличные"), ensure("Карта");
    needs.forEach(p => { p.accountId = ensure(p.method || "Наличные").id; delete p.method; p.updatedAt = nowIso(); });
    if (needs.length) notes.push(`Оплатам без счёта (${needs.length}) назначен счёт по способу оплаты`);
    // Старый учёт «запланировано / в работе» → партии плана со сроком
    state.items.forEach(it => {
      // «Запланировано» — вся партия; «в работе» и готовые — её части.
      // Пример: план 20, в работе 17, готово 3 → партия 20, из неё готово 3, осталось сделать 17.
      const P = Math.round(num(it.planned)), W = Math.round(num(it.wip)), R = Math.max(0, Math.round(num(it.readyTotal)));
      const hasBatch = state.batches.some(b => b.itemId === it.id);
      if ((P > 0 || W > 0) && !hasBatch) {
        let qty, done;
        if (P >= W) { const notStarted = Math.max(0, P - W - R); qty = P; done = P - Math.min(P, W + notStarted); }
        else { qty = P + W; done = 0; } // «в работе» больше плана — значит, считались отдельно
        state.batches.push({ id: uid(), itemId: it.id, qty, done, due: it.planDate || "", note: it.planFor || "", createdAt: nowIso(), updatedAt: nowIso() });
        notes.push(`«${it.name}»: тираж ${qty} шт, из них готово ${done}, осталось сделать ${qty - done}`);
      }
      ["planned", "wip", "wipStage", "planDate", "planFor"].forEach(f => delete it[f]);
    });
    delete state.settings.stages;
    delete state.settings.hourRate;
    state.items.forEach(it => { delete it.hours; });
    state.orders.forEach(o => { delete o.track; });
    (state.shows || []).forEach(sh => { delete sh.place; });
    state.v = FORMAT_VERSION;
    return notes;
  }

  const OP_KINDS = ["Расход", "Доход", "Перевод", "Аванс поставщику", "Кредит получен", "Платёж по кредиту"];
  function opCashDelta(op, accountId) {
    const a = num(op.amount);
    switch (op.kind) {
      case "Доход": case "Кредит получен": return op.accountId === accountId ? a : 0;
      case "Расход": case "Аванс поставщику": case "Платёж по кредиту": return op.accountId === accountId ? -a : 0;
      case "Перевод": return (op.accountId === accountId ? -a : 0) + (op.toAccountId === accountId ? a : 0);
      default: return 0;
    }
  }
  function lastDay(y, m) { return new Date(y, m, 0).getDate(); }
  function ymd(y, m, d) { return `${y}-${String(m).padStart(2, "0")}-${String(Math.min(d, lastDay(y, m))).padStart(2, "0")}`; }
  function shiftYm(ym, delta) { let [y, m] = ym.split("-").map(Number); m += delta; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${String(m).padStart(2, "0")}`; }

  /* Бюджет: остатки, кредиты, налоги, итоги месяца. Ничего не меняет в state. */
  function budget(state, D, ym) {
    const s = state.settings, t = today();
    const accounts = live(state.accounts), ops = live(state.ops), loans = live(state.loans), payments = live(state.payments);
    const A = new Map();
    accounts.forEach(a => A.set(a.id, { account: a, balance: num(a.opening) }));
    payments.forEach(p => { const x = A.get(p.accountId); if (x) x.balance += signed(p); });
    ops.forEach(op => A.forEach((x, id) => { x.balance += opCashDelta(op, id); }));
    let cash = 0; A.forEach(x => { x.balance = round2(x.balance); cash += x.balance; });

    const L = new Map();
    loans.forEach(l => L.set(l.id, { loan: l, balance: num(l.startBalance), paidPrincipal: 0, paidInterest: 0, payments: [], lastPay: "" }));
    ops.forEach(op => {
      if (op.kind !== "Платёж по кредиту") return;
      const x = L.get(op.loanId); if (!x) return;
      x.paidPrincipal += num(op.principal); x.paidInterest += num(op.interest);
      x.payments.push(op); if ((op.date || "") > x.lastPay) x.lastPay = op.date || "";
    });
    let loanDebt = 0;
    const [ty, tm] = t.split("-").map(Number);
    L.forEach(x => {
      x.balance = round2(Math.max(0, x.balance - x.paidPrincipal));
      loanDebt += x.balance;
      const day = Math.round(num(x.loan.payDay));
      if (x.balance > 0 && day >= 1 && !x.loan.closed) {
        const thisDue = ymd(ty, tm, day);
        const paidThisMonth = x.lastPay && x.lastPay.slice(0, 7) === t.slice(0, 7);
        const nm = shiftYm(t.slice(0, 7), 1).split("-").map(Number);
        x.nextDue = paidThisMonth ? ymd(nm[0], nm[1], day) : thisDue;
        x.overdue = !paidThisMonth && thisDue < t;
      }
    });

    // Расходы, прочие доходы, поступления от клиентов по месяцам
    const expenseRows = []; // {date, category, amount, src}
    const incomeRows = [];
    ops.forEach(op => {
      if (op.kind === "Расход") expenseRows.push({ date: op.date, category: op.category || "Прочее", amount: num(op.amount), op });
      if (op.kind === "Платёж по кредиту" && num(op.interest)) expenseRows.push({ date: op.date, category: "Проценты по кредитам", amount: num(op.interest), op });
      if (op.kind === "Аванс поставщику" && op.closedAt) expenseRows.push({ date: op.closedAt, category: op.category || "Прочее", amount: num(op.amount), op });
      if (op.kind === "Доход") incomeRows.push({ date: op.date, category: op.category || "Прочий доход", amount: num(op.amount), op });
    });
    const inMonth = d => (d || "").slice(0, 7) === ym;
    const sum = (rows, f) => round2(rows.filter(f).reduce((a, r) => a + r.amount, 0));
    const byCat = {};
    expenseRows.filter(r => inMonth(r.date)).forEach(r => { byCat[r.category] = round2((byCat[r.category] || 0) + r.amount); });
    const receiptsMonth = round2(payments.filter(p => inMonth(p.date)).reduce((a, p) => a + signed(p), 0));
    let revenue = 0, margin = 0;
    D.O.forEach(d => { if (d.order.status !== CANCELLED && d.order.recognizedAt && inMonth(d.order.recognizedAt)) { revenue += d.total; margin += d.margin; } });
    const otherIncome = sum(incomeRows, r => inMonth(r.date));
    const expenses = sum(expenseRows, r => inMonth(r.date));
    let cashFlow = 0;
    payments.forEach(p => { if (inMonth(p.date) && A.has(p.accountId)) cashFlow += signed(p); });
    ops.forEach(op => { if (inMonth(op.date)) A.forEach((x, id) => { cashFlow += opCashDelta(op, id); }); });

    // Налоговый резерв: база по настройке, накопительно и за месяц
    const pct = num(s.taxPct) / 100;
    const allReceipts = payments.reduce((a, p) => a + signed(p), 0);
    let allRevenue = 0; D.O.forEach(d => { if (d.order.status !== CANCELLED && d.order.recognizedAt) allRevenue += d.total; });
    const allOther = incomeRows.reduce((a, r) => a + r.amount, 0);
    const baseAll = (s.taxBase === "revenue" ? allRevenue : allReceipts) + allOther;
    const baseMonth = (s.taxBase === "revenue" ? revenue : receiptsMonth) + otherIncome;
    const taxPaid = round2(expenseRows.filter(r => r.category === "Налоги").reduce((a, r) => a + r.amount, 0));
    const taxAccrued = round2(baseAll * pct);
    const taxReserve = round2(Math.max(0, taxAccrued - taxPaid));

    const supplierOpen = ops.filter(op => op.kind === "Аванс поставщику" && !op.closedAt);
    const supplierOpenSum = round2(supplierOpen.reduce((a, op) => a + num(op.amount), 0));
    const free = round2(cash - D.totals.advances - taxReserve);

    return { A, L, cash: round2(cash), loanDebt: round2(loanDebt), free, taxReserve, taxAccrued, taxPaid,
      supplierOpen, supplierOpenSum,
      month: { ym, revenue: round2(revenue), margin: round2(margin), otherIncome, expenses, byCat, receipts: receiptsMonth,
        profit: round2(revenue + otherIncome - expenses), cashFlow: round2(cashFlow), taxBase: round2(baseMonth), taxMonth: round2(baseMonth * pct) } };
  }

  /* --- Цепочка «оплачено + готово → списание и выручка». Меняет state, возвращает записи для журнала. --- */
  function reconcile(state) {
    const notes = [];
    for (let pass = 0; pass < 5; pass++) {
      const D = derive(state);
      let changed = false;
      D.O.forEach(d => {
        const o = d.order;
        const should = d.recognizable && o.status !== CANCELLED;
        if (should && !o.recognizedAt) {
          o.recognizedAt = today();
          o.updatedAt = nowIso();
          d.lines.forEach(x => {
            const it = D.itemMap.get(x.line.itemId);
            x.line.costSnap = it ? itemCost(it, state.settings) : 0;
            x.line.updatedAt = nowIso();
          });
          notes.push({ entity: "Заказ", entityId: o.id, text: `Заказ №${o.no}: оплачен и укомплектован — списано со склада, выручка ${d.total.toLocaleString("ru-RU")} ₽` });
          changed = true;
        } else if (!should && o.recognizedAt) {
          o.recognizedAt = "";
          o.updatedAt = nowIso();
          d.lines.forEach(x => { x.line.costSnap = ""; x.line.updatedAt = nowIso(); });
          notes.push({ entity: "Заказ", entityId: o.id, text: `Заказ №${o.no}: списание и выручка отменены (${o.status === CANCELLED ? "заказ отменён" : "оплата или остаток изменились"})` });
          changed = true;
        }
      });
      if (!changed) break;
    }
    return notes;
  }

function resolveClient(v) {
  if (v.clientId) { const c = find("clients", v.clientId); return c ? { client: c } : { error: "Клиент не найден." }; }
  const name = (v.newName || "").trim();
  if (!name) return { error: "Выберите клиента или впишите имя нового." };
  const disc = Core.num(v.newDiscount);
  if (disc < 0 || disc > 100) return { error: "Скидка должна быть от 0 до 100%." };
  const c = touch({ id: Core.uid(), name, phone: (v.newPhone || "").trim(), pickup: (v.newPickup || "").trim(), discount: disc, note: "" });
  S.clients.push(c);
  log("Клиент", c.id, `Добавлен клиент ${c.name}`);
  return { client: c, created: true };
}
const formBtns = (label = "Сохранить") => `<div class="btns g2 bottom"><button type="button" class="btn" data-a="close">Отмена</button><button class="btn primary">${ic("check")}${esc(label)}</button></div>`;

/* ===================== СЕГОДНЯ ===================== */
function todayLabel() {
  const d = new Date();
  return d.toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long" });
}
function renderToday() {
  const t = Core.today(), B = Core.budget(S, D, t.slice(0, 7));
  const soonLimit = (() => { const d = new Date(); d.setDate(d.getDate() + 7); return d.toISOString().slice(0, 10); })();
  let debt = 0, freeReady = 0, toMake = 0;
  D.C.forEach(dc => (debt += dc.debt));
  D.I.forEach(di => { freeReady += Math.max(0, di.free); toMake += di.planned; });

  const late = [], soon = [];
  D.I.forEach(di => di.batches.forEach(x => {
    if (x.open <= 0 || !x.batch.due) return;
    const row = { date: x.batch.due, title: di.item.name, sub: `сделать ${x.open} шт`, icon: "box", act: `data-a="item" data-id="${di.item.id}"` };
    if (x.batch.due < t) late.push(row); else if (x.batch.due <= soonLimit) soon.push(row);
  }));
  Core.live(S.plans).forEach(p => {
    const c = D.clientMap.get(p.clientId); if (!c) return;
    const row = { date: p.date || "", title: `Оплата: ${c.name}`, sub: rub(p.amount), icon: "coins", money: true, act: `data-a="client" data-id="${c.id}"` };
    if (p.date && p.date < t) late.push(row); else if (!p.date || p.date <= soonLimit) soon.push(row);
  });
  D.O.forEach(d => {
    if (d.order.status !== "Готов" || d.order.status === Core.CANCELLED) return;
    const c = D.clientMap.get(d.order.clientId);
    soon.push({ date: d.order.date || "", title: `Выдать заказ №${d.order.no}`, sub: c ? c.name : "", icon: "doc", act: `data-a="order" data-id="${d.order.id}"` });
  });
  D.SH.forEach(x => {
    const sh = x.show; if (sh.closed || !sh.dateFrom) return;
    const row = { date: sh.dateFrom, title: `Выставка «${sh.name}»`, sub: sh.dateTo && sh.dateTo !== sh.dateFrom ? `по ${fdate(sh.dateTo)}` : "", icon: "bookmark", act: `data-a="show" data-id="${sh.id}"` };
    if (sh.dateFrom <= soonLimit) (sh.dateFrom < t ? soon : soon).push(row);
  });
  D.DR.forEach(x => {
    if (x.drop.closed || !x.waiting) return;
    soon.push({ date: x.drop.due || "", title: `Дроп «${x.item ? x.item.name : ""}»`, sub: `${x.waiting} шт без заказа`, icon: "up", act: `data-a="drop" data-id="${x.drop.id}"` });
  });
  const sortRows = a => a.sort((p, q) => ((p.date || "9999") < (q.date || "9999") ? -1 : 1));
  sortRows(late); sortRows(soon);
  const row = r => `<button class="oprow" ${r.act}><span class="ico ${r.money ? "money" : ""}">${ic(r.icon)}</span><span class="l"><b>${esc(r.title)}</b><small>${r.date ? fdate(r.date) : "без даты"}${r.sub ? " · " + esc(r.sub) : ""}</small></span>${ic("chev", "chev")}</button>`;

  return `
    <p class="todaydate">${todayLabel()}</p>
    <section class="bigmoney">
      <span>Свободные деньги</span>
      <b class="num ${B.free < 0 ? "v-red" : ""}">${rub(B.free)}</b>
      <small>на счетах ${rub(B.cash)}${D.totals.advances ? ` · авансы клиентов −${rub(D.totals.advances)}` : ""}${B.taxReserve ? ` · налог −${rub(B.taxReserve)}` : ""}</small>
    </section>
    <section class="sumbar">
      <div class="scells">
        <button class="scell" data-a="goto" data-v="orders:debt"><b class="num money">${rub(debt)}</b><small>должны</small></button>
        <button class="scell" data-a="goto" data-v="stock:planned"><b class="num">${toMake}</b><small>сделать</small></button>
        <button class="scell" data-a="goto" data-v="stock:free"><b class="num">${freeReady}</b><small>готово</small></button>
        <button class="scell" data-a="goto" data-v="budget:overview"><b class="num">${rub(B.month.profit)}</b><small>прибыль, месяц</small></button>
      </div>
    </section>
    <section class="block"><h3>${ic("warn")}Просрочено</h3>
      ${late.length ? late.slice(0, 8).map(row).join("") : `<p class="hint indent">Ничего не просрочено.</p>`}
    </section>
    <section class="block"><h3>${ic("cal")}Ближайшие 7 дней</h3>
      ${soon.length ? soon.slice(0, 10).map(row).join("") : `<p class="hint indent">Дел на неделю не запланировано.</p>`}
    </section>
    <div class="btns g3" style="margin-bottom:10px">
      <button class="btn" data-a="sale">${ic("coins")}Продажа</button>
      <button class="btn" data-a="bulk-ready">${ic("checkc")}Готовые</button>
      <button class="btn" data-a="op-form" data-v="Расход">${ic("down")}Расход</button>
    </div>`;
}

/* ===================== СКЛАД ===================== */
const BUCKETS = [["all", "Все"], ["planned", "Тираж"], ["free", "Готово"], ["reserved", "Резерв"]];
function bucketVal(di, b) {
  return { planned: di.planned, free: Math.max(0, di.free), reserved: di.reserved, sold: di.sold, shortage: di.shortage, atshow: di.atShow, overdue: di.overdue ? 1 : 0 }[b];
}
const pctText = (margin, price) => Core.num(price) > 0 ? ` (${Math.round(margin / Core.num(price) * 100)}%)` : "";
function ingot(di, thin) {
  const v = { p: di.planned, f: Math.max(0, di.free), r: di.reserved, s: di.sold };
  const sum = Object.values(v).reduce((a, b) => a + b, 0);
  return `<div class="ingot${thin ? " thin" : ""}" aria-hidden="true">${sum ? Object.entries(v).filter(([, n]) => n > 0).map(([k, n]) => `<i class="${k}" style="flex:${n}"></i>`).join("") : ""}</div>`;
}
function renderStock() {
  let tp = 0, tf = 0, tr = 0, ts = 0, late = 0, tshow = 0;
  D.I.forEach(di => { tp += di.planned; tf += Math.max(0, di.free); tr += di.reserved; ts += di.shortage; tshow += di.atShow; if (di.overdue) late++; });
  const cell = (v, l, f, cls = "") => `<button class="scell ${cls}" data-a="stock-filter" data-v="${f}" aria-pressed="${view.stockFilter === f}"><b class="num">${v}</b><small>${l}</small></button>`;
  const alerts = [];
  if (ts) alerts.push(`<button class="pill sm red" data-a="stock-filter" data-v="shortage">${ic("warn")}не хватает ${ts}</button>`);
  if (late) alerts.push(`<button class="pill sm red" data-a="stock-filter" data-v="overdue">${ic("cal")}срок прошёл: ${late}</button>`);
  if (tshow) alerts.push(`<button class="pill sm orange" data-a="stock-filter" data-v="atshow">${ic("bookmark")}на выставках ${tshow}</button>`);
  const extra = view.stockFilter === "sold" ? ["sold", "Продано"] : view.stockFilter === "shortage" ? ["shortage", "Не хватает"] : view.stockFilter === "overdue" ? ["overdue", "Срок прошёл"] : view.stockFilter === "atshow" ? ["atshow", "На выставках"] : null;
  return `
    <section class="sumbar">
      <div class="scells">
        ${cell(tf, "готово", "free")}
        ${cell(tr, "резерв", "reserved")}
        ${cell(tp, "сделать", "planned")}
        <span class="scell money"><b class="num">${rub(D.totals.stockValue)}</b><small>готовые по цене</small></span>
      </div>
      ${alerts.length ? `<div class="flags">${alerts.join("")}</div>` : ""}
    </section>
    <div class="seg" role="group" aria-label="Фильтр">${[...BUCKETS, ...(extra ? [extra] : [])].map(([k, l]) => `<button data-a="stock-filter" data-v="${k}" aria-pressed="${view.stockFilter === k}">${l}</button>`).join("")}</div>
    <div class="searchrow">${searchBox("q-stock", "q", "Поиск: название, серия")}<button class="btn iconbtn" data-a="bulk-ready" aria-label="Отметить готовые">${ic("checkc")}</button></div>
    <div class="list" id="list-q">${stockList()}</div>`;
}
function stockList() {
  const q = view.q.toLowerCase();
  let list = [...D.I.values()].filter(di => view.stockFilter === "all" || bucketVal(di, view.stockFilter) > 0);
  if (q) list = list.filter(di => [di.item.name, di.item.series, di.item.material, di.item.coating].join(" ").toLowerCase().includes(q));
  list.sort((a, b) => a.item.name.localeCompare(b.item.name, "ru"));
  if (list.length) {
    const hasSeries = list.some(di => di.item.series);
    if (!hasSeries) return list.map(stockCard).join("");
    const groups = new Map();
    list.forEach(di => { const k = (di.item.series || "").trim(); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(di); });
    const keys = [...groups.keys()].sort((a, b) => (!a ? 1 : !b ? -1 : a.localeCompare(b, "ru")));
    return keys.map(k => {
      const g = groups.get(k);
      let make = 0, free = 0, res = 0, sum = 0;
      g.forEach(di => { make += di.planned; free += Math.max(0, di.free); res += di.reserved; sum += di.totalQty * Core.num(di.item.price); });
      const open = view.openSeries[k] !== false;
      return `<section class="sgroup">
        <button class="shead" data-a="series-toggle" data-v="${esc(k)}" aria-expanded="${open}">
          <span class="l"><b>${k ? esc(k) : "Без серии"}</b><small>${g.length} ${plural(g.length, "модель", "модели", "моделей")} · сделать ${make} · готово ${free}${res ? ` · резерв ${res}` : ""}</small></span>
          <span class="num money">${rub(sum)}</span>${ic("chev", open ? "chev open" : "chev")}
        </button>
        ${open ? `<div class="list">${g.map(stockCard).join("")}</div>` : ""}
      </section>`;
    }).join("");
  }
  if (!S.items.some(i => !i.deleted)) return `<div class="empty">Склад пуст. Нажмите «Изделие» внизу справа — количество, срок и стоимость вводятся сразу.</div>`;
  return `<div class="empty">Под этот фильтр ничего не подходит.</div>`;
}
function counts(di) {
  const c = [["p", di.planned, "сделать"], ["f", Math.max(0, di.free), "готово"], ["r", di.reserved, "резерв"], ["s", di.sold, "продано"]];
  return `<span class="mcounts">${c.map(([k, n, l]) => `<span><i class="dot d-${k}"></i>${l} <b class="num">${n}</b></span>`).join("")}</span>`;
}
function stockCard(di) {
  const i = di.item;
  const flags = [];
  if (di.nextDue) flags.push(`<span class="pill sm ${di.overdue ? "red" : "blue"}">${ic(di.overdue ? "warn" : "cal")}${di.overdue ? "срок прошёл" : "срок"} ${fdate(di.nextDue)}</span>`);
  if (di.shortage) flags.push(`<span class="pill sm red">${ic("warn")}не хватает ${di.shortage}</span>`);
  if (di.atShow) flags.push(`<span class="pill sm orange">${ic("bookmark")}на выставке ${di.atShow}</span>`);

    ${flags.length ? `<span class="flags">${flags.join("")}</span>` : ""}

function activeDropFor(itemId) {
  let found = null;
  D.DR.forEach(x => { if (!found && x.drop.itemId === itemId && !x.drop.closed) found = x; });
  return found;
}
// Все, кто ждёт изделие: записи активного дропа + предзаказы + подписки на серию
function waitersOf(item) {
  const rows = [];
  const seen = new Set();
  const drop = activeDropFor(item.id);
  if (drop) drop.signups.forEach(s => {
    if (!s.client) return;
    seen.add(s.client.id);
    rows.push({ client: s.client, qty: s.qty, kind: "drop", sub: `дроп · ${s.qty} шт${s.order ? `, заказ №${s.order.no}` : ""}`, signup: s.rec, order: s.order });
  });
  Core.live(S.subs).forEach(s => {
    const c = D.clientMap.get(s.clientId); if (!c || seen.has(c.id)) return;
    if (s.kind === "изделие" && s.ref === item.id) { seen.add(c.id); rows.push({ client: c, qty: 1, kind: "sub", sub: "ждёт это изделие", sub_id: s.id }); }
  });
  Core.live(S.subs).forEach(s => {
    const c = D.clientMap.get(s.clientId); if (!c || seen.has(c.id)) return;
    if (s.kind === "серия" && item.series && s.ref === item.series) { seen.add(c.id); rows.push({ client: c, qty: 1, kind: "series", sub: `по серии «${item.series}»`, sub_id: s.id }); }
  });
  return rows;
}
function subscribersOf(item) {
  const ids = new Set(Core.live(S.subs).filter(s => (s.kind === "изделие" && s.ref === item.id) || (s.kind === "серия" && item.series && s.ref === item.series)).map(s => s.clientId));
  return [...ids].map(id => D.clientMap.get(id)).filter(Boolean);
}
function telLink(phone) { return phone ? `<a class="tel" href="tel:${esc(phone.replace(/[^\d+]/g, ""))}">${ic("phone")}${esc(phone)}</a>` : ""; }
function costTable(i, di, n) {
  const st = S.settings;
  const rows = [
    ["Материалы", Core.num(i.matCost), ""], ["Расходники", Core.num(i.consCost), ""],
    ["Себестоимость", di.cost, "strong sep"], ["Цена", Core.num(i.price), "strong"], ["Маржа", di.margin, "accent"]

    ${rows.map(([l, v, cls]) => `<div class="cr ${cls}"><span>${esc(l)}</span><span class="num">${rub(v)}</span>${two ? `<span class="num">${rub(v * n)}</span>` : ""}</div>`).join("")}
  </div>`;
}
function itemSheet(id) {
  return () => {
    const di = D.I.get(id); if (!di) return null;
    const i = di.item, st = S.settings;
    const ordersWith = [];
    D.O.forEach(d => { if (d.order.status === Core.CANCELLED) return; d.lines.forEach(x => { if (x.line.itemId === id && !d.order.recognizedAt) ordersWith.push([d, x]); }); });
    const drop = activeDropFor(id);
    const t = Core.today();
    const people = [];
    const rest = d => Core.round2(d.total - d.paid);
    waitersOf(i).forEach(r => {
      if (r.kind === "drop" && r.order) return;
      people.push({ name: r.client.name, sub: `ждёт${r.qty > 1 ? ` · ${r.qty} шт` : ""}${r.kind === "series" ? ` · по серии «${esc(i.series)}»` : ""}`,
        act: "client", actId: r.client.id,
        buttons: `${r.kind === "drop" ? `<button class="btn small" data-a="drop-order" data-id="${r.signup.id}">${ic("docplus")}Заказ</button>` : ""}
          ${r.kind === "drop" ? `<button class="btn textred" data-a="signup-del" data-id="${r.signup.id}" aria-label="Убрать">${ic("trash")}</button>` : r.kind === "sub" ? `<button class="btn textred" data-a="sub-del" data-id="${r.sub_id}" aria-label="Убрать">${ic("trash")}</button>` : ""}` });
    });
    const bought = new Map();
    D.O.forEach(dd => {
      if (dd.order.status === Core.CANCELLED) return;
      const c = D.clientMap.get(dd.order.clientId); if (!c) return;
      const qty = dd.lines.filter(x => x.line.itemId === id).reduce((a, x) => a + Core.num(x.line.qty), 0);
      if (!qty) return;
      if (!dd.order.recognizedAt) {
        const left = rest(dd);
        people.push({ name: c.name, sub: `заказ №${dd.order.no} · ${qty} шт · ${left > 0.005 ? `к оплате ${rub(left)}` : "оплачен"}`,
          act: "order", actId: dd.order.id,
          buttons: `${left > 0.005 ? `<button class="btn small" data-a="pay-form" data-client="${c.id}" data-order="${dd.order.id}">${ic("card")}Оплата</button>` : ""}` });
      } else {
        const k = dd.gross > 0 ? dd.total / dd.gross : 1;
        const sum = dd.lines.filter(x => x.line.itemId === id).reduce((a, x) => a + Core.num(x.line.qty) * Core.num(x.line.price) * k, 0);
        const r0 = bought.get(c.id) || { name: c.name, id: c.id, qty: 0, sum: 0, last: "" };
        r0.qty += qty; r0.sum += sum; if ((dd.order.date || "") > r0.last) r0.last = dd.order.date || "";
        bought.set(c.id, r0);
      }
    });
    bought.forEach(r0 => people.push({ name: r0.name, sub: `куплено ${r0.qty} шт на ${rub(r0.sum)}${r0.last ? ` · ${fdate(r0.last)}` : ""}`, act: "client", actId: r0.id, buttons: "" }));
    const byClient = new Map();
    D.O.forEach(d => {
      if (d.order.status === Core.CANCELLED) return;
      const k = d.gross > 0 ? d.total / d.gross : 1;
      d.lines.forEach(x => {
        if (x.line.itemId !== id) return;
        const c = D.clientMap.get(d.order.clientId); if (!c) return;
        const r = byClient.get(c.id) || { client: c, bought: 0, pending: 0, sum: 0, last: "", orders: [] };
        const q = Core.num(x.line.qty);
        if (d.order.recognizedAt) { r.bought += q; r.sum += q * Core.num(x.line.price) * k; }
        else r.pending += q;
        const dt = d.order.date || "";
        if (dt > r.last) r.last = dt;
        r.orders.push(d);
        byClient.set(c.id, r);
      });
    });
    const clientRows = [...byClient.values()].sort((a, b) => (b.bought + b.pending) - (a.bought + a.pending) || (a.last < b.last ? 1 : -1));
    return { title: i.name, key: "item" + id, html: `
      <div class="hero">
        <div class="price num">${rub(i.price)} <small class="per">за шт</small></div>
        <div class="meta">${[i.series, i.material, i.coating].filter(Boolean).map(esc).join(", ") || "&nbsp;"}</div>
        <div class="mg">Маржа за шт<b class="num">${rub(di.margin)}</b>${pctText(di.margin, i.price)}</div>
      </div>
      <section class="block"><h3>${ic("box")}Остатки</h3>
        ${ingot(di)}
        <div class="legend">
          <div class="col">
            <div><span><i class="dot d-p"></i>Осталось сделать</span><b class="num">${di.planned}</b></div>
            <div><span><i class="dot d-f"></i>Свободно готовых</span><b class="num">${di.free}</b></div>
            <div><span><i class="dot d-r"></i>В резерве</span><b class="num">${di.reserved}</b></div>
            ${di.atShow ? `<div><span><i class="dot d-w"></i>На выставке</span><b class="num">${di.atShow}</b></div>` : ""}
          </div>
          <div class="col">
            <div><span><i class="dot d-s"></i>Продано</span><b class="num">${di.sold}</b></div>
            <div><span>Всего</span><b class="num">${di.totalQty}</b></div>
          </div>
        </div>
        ${i.madeAt ? `<div class="kv sep"><span>Изготовлено</span><span>${fdate(i.madeAt)} · на складе ${ageText(i.madeAt)}</span></div>` : ""}
        <div class="btns g2"><button class="btn primary" data-a="ready" data-id="${id}">${ic("checkc")}Готово</button><button class="btn" data-a="sale" data-id="${id}">${ic("coins")}Продать</button></div>
      </section>
      <section class="block"><h3>${ic("cal")}Тиражи и сроки</h3>
        ${di.batches.filter(x => x.open > 0).map(x => { const late = x.batch.due && x.batch.due < t;
          return `<button class="rowlink" data-a="batch-form" data-id="${x.batch.id}" data-item="${id}"><span class="l"><b>Осталось ${x.open} из ${x.batch.qty} шт${Core.num(x.batch.done) ? ` <small style="display:inline">· готово ${x.batch.done}</small>` : ""}</b><small ${late ? 'style="color:var(--red)"' : ""}>${x.batch.due ? (late ? "срок прошёл " : "срок ") + fdate(x.batch.due) : "без срока"}${x.batch.note ? " · " + esc(x.batch.note) : ""}</small></span>${ic("chev", "chev")}</button>`; }).join("") || `<p class="hint indent">Открытых тиражей нет.</p>`}
        <div class="btns"><button class="btn" data-a="batch-form" data-item="${id}">${ic("plus")}Новый тираж</button></div>
      </section>
      <section class="block"><h3>${ic("coins")}Стоимость</h3>

          }

          sheets.pop(); if (!id) sheets.push(itemSheet(rec.id));
          commit();

      } };
  };

          Object.assign(rec, { qty: q, done: dn, due: v.due || "", note: v.note || "" });

          di.batches.forEach(x => { if (left <= 0 || x.open <= 0) return; const take = Math.min(left, x.open); x.batch.done = Core.num(x.batch.done) + take; touch(x.batch); left -= take; closed += take; });
          i.readyTotal = Core.num(i.readyTotal) + q; i.madeAt = Core.today(); touch(i);
          log("Изделие", i.id, `«${i.name}»: ${q} шт готово${closed ? `, засчитано в тираж ${closed}` : ""}`);
          sheets.pop();
          commit();
          const d2 = D.I.get(i.id);
          if (waitersOf(i).length && d2 && d2.free > 0) openSheet(notifySheet(i.id));

function bulkReadySheet() {

    return { title: "Отметить готовые", key: "bulk", html: `<form id="f-bulk">

        ${list.map(di => `<div class="bulkrow"><span class="l"><b>${esc(di.item.name)}</b><small>${di.planned ? `осталось сделать ${di.planned}` : "тиража нет"} · готово ${Math.max(0, di.free)}</small></span>

            di.batches.forEach(x => { if (left <= 0 || x.open <= 0) return; const take = Math.min(left, x.open); x.batch.done = Core.num(x.batch.done) + take; touch(x.batch); left -= take; closed += take; });
            di.item.readyTotal = Core.num(di.item.readyTotal) + q; di.item.madeAt = Core.today(); touch(di.item);
            parts.push(`${di.item.name} +${q}${closed ? ` (в тираж ${closed})` : ""}`);

          log("Изделие", "", `Отмечено готовыми: ${parts.join(", ")}`);
          sheets.pop(); commit();
          const notify = picks.map(([di]) => D.I.get(di.item.id)).filter(di => di && di.free > 0 && waitersOf(di.item).length);
          if (notify.length) openSheet(notifySheet(notify[0].item.id));
        };
      } };
  };

function calendarEvents(ym) {
  const t = Core.today(), ev = [];
  D.I.forEach(di => di.batches.forEach(x => {
    if (x.open > 0 && x.batch.due && x.batch.due.slice(0, 7) === ym)
      ev.push({ date: x.batch.due, kind: "plan", title: `Срок: ${di.item.name}`, sub: `осталось ${x.open} из ${x.batch.qty} шт${x.batch.note ? " · " + x.batch.note : ""}`, late: x.batch.due < t, act: `data-a="item" data-id="${di.item.id}"` });
  }));
  Core.live(S.plans).forEach(p => {
    if (p.date && p.date.slice(0, 7) === ym) { const c = D.clientMap.get(p.clientId); ev.push({ date: p.date, kind: "money", title: `Ожидается оплата: ${c ? c.name : ""}`, sub: rub(p.amount), late: p.date < t, act: `data-a="client" data-id="${p.clientId}"` }); }
  });
  D.SH.forEach(x => { const sh = x.show; if (sh.dateFrom && sh.dateFrom.slice(0, 7) === ym) ev.push({ date: sh.dateFrom, kind: "show", title: `Выставка: ${sh.name}`, sub: showDates(sh) || "выставка", late: false, act: `data-a="show" data-id="${sh.id}"` }); });
  return ev.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
}
function calendarSheet() {
  let ym = Core.today().slice(0, 7), selDay = "";
  return () => {
    const ev = calendarEvents(ym);
    const [y, m] = ym.split("-").map(Number);
    const first = new Date(y, m - 1, 1), days = new Date(y, m, 0).getDate();
    const lead = (first.getDay() + 6) % 7;
    const t = Core.today();
    const cells = [];
    for (let k = 0; k < lead; k++) cells.push(`<span class="cd empty"></span>`);
    for (let d = 1; d <= days; d++) {
      const ds = `${ym}-${String(d).padStart(2, "0")}`;
      const de = ev.filter(e => e.date === ds);
      const kinds = [...new Set(de.map(e => e.kind))];
      const late = de.some(e => e.late);
      cells.push(`<button type="button" class="cd${ds === t ? " today" : ""}${ds === selDay ? " sel" : ""}" data-day="${ds}" aria-label="${d}, событий: ${de.length}"><span>${d}</span><span class="dots">${kinds.map(k => `<i class="k-${late && k === "plan" ? "late" : k}"></i>`).join("")}</span></button>`);
    }
    const list = selDay ? ev.filter(e => e.date === selDay) : ev;
    return { title: "Календарь", key: "calendar", html: `
      <div class="monthsw"><button class="btn small" id="cal-prev" aria-label="Предыдущий месяц">${ic("left")}</button><b>${ymLabel(ym)}</b><button class="btn small" id="cal-next" aria-label="Следующий месяц">${ic("chev")}</button></div>
      <section class="block cal">
        <div class="wd">${["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"].map(x => `<span>${x}</span>`).join("")}</div>
        <div class="grid">${cells.join("")}</div>
        <div class="legend-cal"><span><i class="k-plan"></i>срок изделия</span><span><i class="k-late"></i>срок прошёл</span><span><i class="k-money"></i>оплата клиента</span><span><i class="k-loan"></i>выставка</span></div>
      </section>
      <p class="sect-title">${selDay ? fdate(selDay) : "Все события месяца"}${selDay ? ` <button class="btn small" id="cal-all" style="margin-left:8px">Весь месяц</button>` : ""}</p>
      <div class="list">${list.map(e => `<button class="oprow" ${e.act}><span class="ico ${e.kind === "plan" ? "" : "money"}">${ic(e.kind === "plan" ? "box" : e.kind === "loan" ? "bank" : "coins")}</span><span class="l"><b>${esc(e.title)}</b><small ${e.late ? 'style="color:var(--red)"' : ""}>${fdate(e.date)}${e.late ? ", просрочено" : ""} · ${esc(e.sub)}</small></span>${ic("chev", "chev")}</button>`).join("") || `<div class="empty">${selDay ? "В этот день событий нет." : "В этом месяце событий нет."}</div>`}</div>`,
      after: l => {
        $("#cal-prev", l).onclick = () => { ym = Core.shiftYm(ym, -1); selDay = ""; renderSheet(); };
        $("#cal-next", l).onclick = () => { ym = Core.shiftYm(ym, 1); selDay = ""; renderSheet(); };
        const all = $("#cal-all", l); if (all) all.onclick = () => { selDay = ""; renderSheet(); };
        l.querySelectorAll("[data-day]").forEach(b => (b.onclick = () => { selDay = selDay === b.dataset.day ? "" : b.dataset.day; renderSheet(); }));
      } };
  };
}

function orderList() {

    if (c) return false;
    if (f === "done") return orderDone(d);

function shortageSheet(orderId) {
  return () => {
    const d = D.O.get(orderId); if (!d) return null;
    const need = new Map();

function returnSheet(id) {
  return () => {
    const d = D.O.get(id); if (!d || !d.lines.length) return null;
    const c = D.clientMap.get(d.order.clientId);
    const k = d.gross > 0 ? d.total / d.gross : 1;
    return { title: `Возврат по заказу №${d.order.no}`, key: "ret" + id, html: `<form id="f-ret">
      <p class="hint">Впишите, сколько штук вернулось. Изделия вернутся на склад, а сумма по ценам заказа со скидкой — клиенту.</p>
      <section class="block">
        ${d.lines.map(x => { const it = D.itemMap.get(x.line.itemId);
          return `<div class="bulkrow"><span class="l"><b>${esc(it ? it.name : "изделие")}</b><small class="num">в заказе ${x.line.qty} × ${rub(x.line.price)}</small></span>
            <input class="bqty" name="q_${x.line.id}" type="number" inputmode="numeric" min="0" max="${x.line.qty}" step="1" placeholder="0" aria-label="Вернуть, шт"></div>`; }).join("")}
        <div class="kv accent sep"><span>Сумма возврата</span><span class="num" id="ret-sum">0 ₽</span></div>
      </section>
      <section class="block">
        <label class="check"><input type="checkbox" name="refund" value="1" ${d.paid > 0 ? "checked" : ""}> Вернуть деньги клиенту${c ? ` (${esc(c.name)})` : ""}</label>
        ${accountSelect("accountId", "Со счёта")}
        ${fld("Дата", "date", Core.today(), "date")}
      </section>
      <div id="f-err" class="err"></div>${formBtns("Оформить возврат")}</form>`,
      after: l => {
        const form = $("#f-ret", l);
        const calc = () => {
          const v = formData(form);
          let sum = 0;
          d.lines.forEach(x => { const q = Math.min(Math.max(0, Math.round(Core.num(v["q_" + x.line.id]))), x.line.qty); sum += q * Core.num(x.line.price) * k; });
          $("#ret-sum", l).textContent = rub(sum);
          return Core.round2(sum);
        };
        form.addEventListener("input", calc); calc();
        form.onsubmit = e => {
          e.preventDefault();
          const v = formData(form);
          const picks = [];
          d.lines.forEach(x => { const q = Math.min(Math.max(0, Math.round(Core.num(v["q_" + x.line.id]))), x.line.qty); if (q > 0) picks.push([x, q]); });
          if (!picks.length) { $("#f-err", l).textContent = "Укажите, сколько штук вернулось."; return; }
          const sum = calc();
          const o = find("orders", id);
          const names = [];
          picks.forEach(([x, q]) => {
            const it = D.itemMap.get(x.line.itemId);
            const line = S.lines.find(z => z.id === x.line.id);
            names.push(`${it ? it.name : "изделие"} ×${q}`);
            if (q >= Core.num(line.qty)) { line.deleted = true; } else { line.qty = Core.num(line.qty) - q; }
            touch(line);
          });
          const rest = Core.live(S.lines).filter(z => z.orderId === id);
          if ((v.refund || []).length && sum > 0) {
            const pay = touch({ id: Core.uid(), clientId: o.clientId, orderId: id, date: v.date || Core.today(), kind: "Возврат", amount: sum, accountId: v.accountId, note: `Возврат по заказу №${o.no}` });
            S.payments.push(pay);
          }
          if (!rest.length) { o.status = Core.CANCELLED; touch(o); }
          log("Заказ", id, `Возврат по заказу №${o.no}: ${names.join(", ")} на ${rub(sum)}${(v.refund || []).length ? ", деньги возвращены" : ", деньги оставлены"}${!rest.length ? "; заказ отменён" : ""}`);
          sheets.pop(); commit(`Оформлен возврат на ${rub(sum)}`);
        };
      } };
  };
}

  return `

      ${stat(rub(expected), `ждём оплат${overdue ? `, <span class="v-red" style="display:inline">просрочено ${rub(overdue)}</span>` : ""}`, "clock", overdue ? "v-red" : "")}

function clientList() {
  const all = [...D.C.values()];
  const q = view.cq.toLowerCase();

  if (q) list = list.filter(dc => [dc.client.name, dc.client.phone, dc.client.pickup].join(" ").toLowerCase().includes(q));

function subsForm(id) {

    const items = Core.live(S.items).sort((a, b) => a.name.localeCompare(b.name, "ru"));

          want.forEach(([k, r]) => { if (!has(k, r)) { S.subs.push(touch({ id: Core.uid(), clientId: id, kind: k, ref: r })); changes.push("+" + (k === "изделие" ? (find("items", r) || {}).name : r)); } });
          if (changes.length) log("Клиент", id, `Подписки ${c.name}: ${changes.join(", ")}`);
          sheets.pop(); commit();
        };
      } };
  };
}

        <div class="chips" style="margin-bottom:12px">${kinds.map(x => `<button type="button" data-kind="${x}" aria-pressed="${k === x}">${x}</button>`).join("")}</div>
        ${fld("Сумма, ₽ *", "amount", draft.amount, "number")}
        ${fld("Дата", "date", draft.date, "date")}
        ${k === "Перевод" ? `<div class="grid2">${accountSelect("accountId", "Со счёта", draft.accountId)}${sel("На счёт", "toAccountId", accs.map(a => [a.id, a.name]), draft.toAccountId || (accs[1] || accs[0]).id)}</div>`
          : accountSelect("accountId", k === "Доход" || k === "Кредит получен" ? "На счёт" : "Со счёта", draft.accountId)}
        ${k === "Расход" || k === "Доход" || k === "Аванс поставщику" ? `<label class="f">Категория${k === "Аванс поставщику" ? " (станет расходом при закрытии)" : ""}<input name="category" list="dl-cats" value="${esc(draft.category || cats[0] || "")}"></label><datalist id="dl-cats">${cats.map(x => `<option value="${esc(x)}">`).join("")}</datalist>` : ""}
        ${k === "Аванс поставщику" ? fld("Поставщик", "counterparty", draft.counterparty) : ""}
        ${fld("Заметка", "note", draft.note)}
        ${k === "Доход" ? `<p class="hint">Продажу изделия вносите кнопкой «Продажа» — тогда оно спишется со склада. Здесь — прочие доходы.</p>` : ""}
        ${draft.showId && D.showMap.get(draft.showId) ? `<p class="hint">Расход привязан к выставке «${esc(D.showMap.get(draft.showId).name)}» и попадёт в её прибыль.</p>` : ""}
        ${k === "Кредит получен" ? `<p class="hint">Получение кредита — не доход: деньги на счёте растут, долг учитывается в карточке кредита.</p>` : ""}
      </section>
      <div id="f-err" class="err"></div>${formBtns()}</form>`,
      after: l => {
        const form = $("#f-op", l);
        const pull = () => { const v = formData(form); Object.assign(draft, v); return v; };
        l.querySelectorAll("[data-kind]").forEach(b => (b.onclick = e => { e.stopPropagation(); pull(); draft.kind = b.dataset.kind; draft.category = ""; renderSheet(); }));
        form.onsubmit = e => {
          e.preventDefault();
          const v = pull();
          const amt = Core.round2(Core.num(v.amount));
          const err = $("#f-err", l);
          if (amt <= 0) { err.textContent = "Сумма должна быть больше нуля."; return; }
          if (!v.accountId) { err.textContent = "Выберите счёт."; return; }
          if (draft.kind === "Перевод" && v.toAccountId === v.accountId) { err.textContent = "Счета списания и зачисления совпадают."; return; }
          const rec = op || { id: Core.uid(), closedAt: "", showId: draft.showId || "" };
          Object.assign(rec, { kind: draft.kind, date: v.date || Core.today(), amount: amt, accountId: v.accountId, toAccountId: draft.kind === "Перевод" ? v.toAccountId : "",
            category: v.category || "", counterparty: v.counterparty || "", note: v.note || "" });
          if (rec.kind !== "Аванс поставщику") rec.closedAt = "";
          touch(rec); if (!op) S.ops.push(rec);
          log("Бюджет", rec.id, `${op ? "Изменена" : "Добавлена"} операция: ${opMeta(rec).title}, ${rub(amt)}`);
          sheets.pop(); commit();
        };
      } };
  };
}
function opSheet(id) {

        <datalist id="dl-cats2">${S.settings.expenseCats.map(x => `<option value="${esc(x)}">`).join("")}</datalist>

}
/* --- Счета --- */
function accountSheet(id) {
  return () => {
    const a = find("accounts", id); if (!a) return null;
    const B = Core.budget(S, D, view.ym);
    const x = B.A.get(id);
    const moves = [];
    Core.live(S.payments).forEach(p => { if (p.accountId === id) moves.push({ date: p.date, html: payOpRow(p) }); });
    Core.live(S.ops).forEach(op => { if (op.accountId === id || op.toAccountId === id) moves.push({ date: op.date, html: opRow(op) }); });
    moves.sort((p, q) => (p.date < q.date ? 1 : -1));
    return { title: a.name, key: "acc" + id, html: `
      <section class="block"><div class="kv accent"><span>Остаток</span><span class="num">${rub(x ? x.balance : 0)}</span></div>
        <div class="kv"><span>Начальный остаток</span><span class="num">${rub(a.opening)}${a.openingDate ? " на " + fdate(a.openingDate) : ""}</span></div></section>
      <p class="sect-title">Последние движения</p>
      <div class="list">${moves.slice(0, 30).map(m => m.html).join("") || `<div class="empty">Движений нет.</div>`}</div>
      <div class="btns g2 bottom"><button class="btn outline" data-a="account-form" data-id="${id}">${ic("pencil")}Изменить</button><button class="btn danger" id="acc-del">${ic("trash")}Удалить</button></div>`,
      after: l => {
        $("#acc-del", l).onclick = () => {
          if (moves.length) { toast("По счёту есть движения — удалить нельзя."); return; }
          confirmSheet("Удалить счёт?", esc(a.name), "Удалить", () => { a.deleted = true; touch(a); log("Бюджет", id, `Удалён счёт «${a.name}»`); sheets.length = 0; commit(`Удалён счёт «${a.name}»`); }, true);
        };
      } };
  };
}

/* --- Кредиты --- */

      <section class="block"><h3>${ic("doc")}Платежи</h3>

        <button class="btn danger" id="loan-del">${ic("trash")}Удалить</button>

        $("#loan-close", l).onclick = () => { loan.closed = !loan.closed; touch(loan); log("Кредит", id, `Кредит «${loan.name}» ${loan.closed ? "закрыт" : "открыт снова"}`); commit(); };
        $("#loan-del", l).onclick = () => {
          if (pays.length || got.length) { toast("По кредиту есть операции — удалить нельзя. Можно закрыть."); return; }
          confirmSheet("Удалить кредит?", esc(loan.name), "Удалить", () => { loan.deleted = true; touch(loan); log("Кредит", id, `Удалён кредит «${loan.name}»`); sheets.length = 0; commit(); }, true);
